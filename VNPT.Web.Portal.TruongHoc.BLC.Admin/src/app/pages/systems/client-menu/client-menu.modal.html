<!-- <div class="card card-primary"> -->
<!-- <div class="card-body"> -->
    <div class="row">
        <div class="col-md-2">
            <div class="form-group">
                <label>Vị trí menu</label>
                <div>
                    <p-dropdown optionLabel="Name" optionValue="Id" [filter]="true" [(ngModel)]="item.MenuPosition"
                        [options]="menuPositions" (onChange)="changeViTriMenu()" appendTo="body">
                    </p-dropdown>
                </div>
            </div>
        </div>
        <div class="col-md-2">
            <div class="form-group">
                <label>Menu cha</label>
                <p-dropdown optionLabel="Name" optionValue="Id" [filter]="true" [(ngModel)]="parent" [options]="menus"
                    appendTo="body">
                </p-dropdown>
            </div>
        </div>
    
        <div class="col-md-2" *ngIf="(item.MenuPosition == 2 || item.MenuPosition == 3)">
            <div class="form-group">
                <label>Loại menu</label>
                <p-dropdown optionLabel="Name" optionValue="Id" [filter]="true" [(ngModel)]="item.MenuType"
                    [options]="menuDocTypes" appendTo="body" (onChange)="changeAction()">
                </p-dropdown>
            </div>
        </div>
        <div class="col-md-2">
            <div class="form-group">
                <label for="OrderNo">Thứ tự <span class="text-danger">(*)</span></label>
                <input type="number" class="form-control" [(ngModel)]="item.OrderNo">
            </div>
        </div>
    
        <div class="col-md-2">
            <div class="form-group">
                <label for="Parameter">Hiển thị</label>
                <p-checkbox [binary]="true" [(ngModel)]="item.IsShowMenu"></p-checkbox>
            </div>
        </div>
        <div class="col-md-2">
            <div class="form-group">
                <label for="Parameter">Mở ra trang mới</label>
                <p-checkbox [binary]="true" [(ngModel)]="item.IsOpenBlankPage"></p-checkbox>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4"
            *ngIf="item.MenuPosition == 1 || item.MenuPosition == 5 || item.MenuPosition == 2 ||(item.MenuPosition == 3&& (item.MenuType == 1 || item.MenuType == 3 || item.MenuType == 4 || item.MenuType == 44 || item.MenuType == 6))">
            <div class="form-group">
                <label for="Title">Tiêu đề <span class="text-danger">(*)</span></label>
                <input type="text" class="form-control" [(ngModel)]="item.Title" (keyup)="changeTitle($event)">
            </div>
        </div>
        <div class="col-md-2" *ngIf="item.MenuPosition == 1 || item.MenuPosition == 5">
            <div class="form-group">
                <label for="Parameter">Mở link khác</label>
                <p-checkbox [binary]="true" [(ngModel)]="item.IsNewsImage"></p-checkbox>
            </div>
        </div>
        <div class="col-md-12"
        *ngIf="item.MenuPosition == 3 && item.MenuType == 5">
        <div class="form-group">
          <label style="color: red;">Hình ảnh</label>
          <div>
            <div class="btn bg-pro color-white" (click)="openFileDilog()">
              Chọn hình ảnh
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-12"
        *ngIf="item.MenuPosition == 3 && item.MenuType == 5">
        <div class="form-group">
          <div class="row-custom">
            <div style="background-color: #ececec; width: 500px; height: 100px; padding: 10px;">
              <img [src]="imageUrl | imageUrlPipe: 'thumb'" style="width: 100%; height: 100%" />
            </div>
          </div>
        </div>
      </div>
        <div class="col-md-3" *ngIf="(item.IsNewsImage && item.MenuPosition == 1) || (item.IsNewsImage && item.MenuPosition == 5) || (item.MenuPosition == 3 && item.MenuType == 5)">
            <div class="form-group">
                <label for="Action">Action</label>
                <input type="text" class="form-control" [(ngModel)]="item.Action">
            </div>
        </div>
        <div class="col-md-3" *ngIf="(!item.IsNewsImage && item.MenuPosition == 1) || (!item.IsNewsImage && item.MenuPosition == 5)">
            <div class="form-group">
                <label>Action</label>
                <p-dropdown optionLabel="Name" optionValue="Value" [filter]="true" [(ngModel)]="item.Action"
                    [options]="actions" (onChange)="changeAction()" appendTo="body">
                </p-dropdown>
            </div>
        </div>

        <div class="col-md-3" *ngIf="item.MenuPosition == 5 && item.Action == 'co-quan-nhiem-ky'">
            <div class="form-group">
                <label>Chọn cơ quan nhiệm kỳ</label>
                <p-dropdown optionLabel="Name" optionValue="Value" [filter]="true" [(ngModel)]="coQuanNhiemKyModel"
                    [options]="coQuanNhiemKys" appendTo="body">
                </p-dropdown>
                <!-- <button class="btn btn-success btn-xs" (click)="addDanhMuc()">Thêm danh mục</button> -->
            </div>
        </div>

        <div class="col-md-3"
            *ngIf="(item.MenuPosition == 1 && (item.Action == 'danh-sach-tin-tuc' || item.Action == 'chi-tiet-tin-tuc')) || (item.MenuPosition == 5 && (item.Action == 'danh-sach-tin-tuc' || item.Action == 'chi-tiet-tin-tuc')) || item.MenuPosition == 2 ||(item.MenuPosition == 3 && (item.MenuType == 3 || item.MenuType == 4 || item.MenuType == 44))">
            <div class="form-group">
                <label>Danh mục</label>
                <p-dropdown optionLabel="Title_En" optionValue="Parameter" [filter]="true" [(ngModel)]="news"
                    [options]="newses" (onChange)="changeNews()" appendTo="body">
                </p-dropdown>
                <button class="btn btn-success btn-xs" (click)="addDanhMuc()">Thêm danh mục</button>
            </div>
        </div>
    
        <div class="col-md-3" *ngIf="(item.MenuPosition == 1 || item.MenuPosition == 5) && item.Action == 'chi-tiet-tin-tuc'">
            <div class="form-group">
                <label>Bài viết</label>
                <p-dropdown optionLabel="Title" optionValue="Alias" [filter]="true" [(ngModel)]="newsDetail"
                    [options]="newsDetails" appendTo="body">
                </p-dropdown>
            </div>
        </div>
        <div class="col-md-3"
            *ngIf="(this.item.MenuPosition == 5 && this.item.Action == 'danh-sach-tin-tuc') || (this.item.MenuPosition == 1 && this.item.Action == 'danh-sach-tin-tuc') || this.item.MenuPosition == 2 || (this.item.MenuPosition == 3 && (this.item.MenuType == 3 || this.item.MenuType == 4 || item.MenuType == 44))">
            <div class="form-group">
                <label>Loại bài viết</label>
                <p-dropdown optionLabel="Name" optionValue="Id" [filter]="true" [(ngModel)]="type" [options]="types"
                    appendTo="body">
                </p-dropdown>
                <button class="btn btn-success btn-xs" (click)="addNewsType(news,0)">Thêm loại</button>
            </div>
        </div>
    
    
        <div class="col-md-4" *ngIf="item.MenuPosition == 3 && (item.MenuType == 2 || item.MenuType == 22)">
            <div class="form-group">
                <label>Danh mục 1</label>
                <p-dropdown optionLabel="Title_En" optionValue="Parameter" [filter]="true" [(ngModel)]="item.News1"
                    [options]="newses" (onChange)="changeNewsTrangChu(1)" appendTo="body">
                </p-dropdown>
                <button class="btn btn-success btn-xs" (click)="addDanhMuc()">Thêm danh mục</button>
            </div>
        </div>
        <div class="col-md-4" *ngIf="item.MenuPosition == 3 && (item.MenuType == 2 || item.MenuType == 22)">
            <div class="form-group">
                <label for="Title">Tiêu đề 1<span class="text-danger">(*)</span></label>
                <input type="text" class="form-control" [(ngModel)]="item.Title1">
            </div>
        </div>
        <div class="col-md-2" *ngIf="item.MenuPosition == 3 && (item.MenuType == 2 || item.MenuType == 22)">
            <div class="form-group">
                <label>Loại bài viết 1</label>
                <p-dropdown optionLabel="Name" optionValue="Id" [filter]="true" [(ngModel)]="item.Type1"
                    [options]="item.Types1" appendTo="body">
                </p-dropdown>
                <button class="btn btn-success btn-xs" (click)="addNewsType(item.News1,1)">Thêm loại</button>
            </div>
        </div>
    
        <div class="col-md-4" *ngIf="item.MenuPosition == 3 && (item.MenuType == 2 || item.MenuType == 22)">
            <div class="form-group">
                <label>Danh mục 2</label>
                <p-dropdown optionLabel="Title_En" optionValue="Parameter" [filter]="true" [(ngModel)]="item.News2"
                    [options]="newses" (onChange)="changeNewsTrangChu(2)" appendTo="body">
                </p-dropdown>
                <button class="btn btn-success btn-xs" (click)="addDanhMuc()">Thêm danh mục</button>
            </div>
        </div>
        <div class="col-md-4" *ngIf="item.MenuPosition == 3 && (item.MenuType == 2 || item.MenuType == 22)">
            <div class="form-group">
                <label for="Title">Tiêu đề 2<span class="text-danger">(*)</span></label>
                <input type="text" class="form-control" [(ngModel)]="item.Title2">
            </div>
        </div>
        <div class="col-md-2" *ngIf="item.MenuPosition == 3 && (item.MenuType == 2 || item.MenuType == 22)">
            <div class="form-group">
                <label>Loại bài viết 2</label>
                <p-dropdown optionLabel="Name" optionValue="Id" [filter]="true" [(ngModel)]="item.Type2"
                    [options]="item.Types2" appendTo="body">
                </p-dropdown>
                <button class="btn btn-success btn-xs" (click)="addNewsType(item.News2,2)">Thêm loại</button>
            </div>
        </div>
    </div>
    
    <div class="p-footer">
        <div class="f-contains">
            <button class="btn btn-info" type="submit" (click)="submit()" [disabled]="isSaving">Lưu thay đổi</button>
            <button class="btn btn-outline-danger" type="submit" (click)="cancel()">Thoát</button>
        </div>
    </div>
