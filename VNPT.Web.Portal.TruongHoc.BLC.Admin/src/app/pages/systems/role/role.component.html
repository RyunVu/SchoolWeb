<div class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h4 class="m-0 text-dark">Quản lý quyền</h4>
            </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item"><a href="#">Home</a></li>
                    <li class="breadcrumb-item active">Roles</li>
                </ol>
            </div>
        </div>
    </div>
</div>

<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-12 col-12">
                <div class="card card-primary card-outline">
                    <div class="card-header">
                        <div class="row">
                            <div class="col-md-10">
                                <div class="form-group">
                                    <label for="Name">Từ khóa tìm kiếm</label>
                                    <input type="text" class="form-control" [(ngModel)]="keywordInput"
                                        placeholder="Từ khóa tìm kiếm" />
                                </div>
                            </div>
                            <div class="col-md-2" style="padding-top: 37px;">
                                <button (click)="loadPage()" type="button" class="btn btn-info btn-sm"
                                    style="margin-right: 5px;">
                                    <i class="fa fa-filter"></i> Tìm kiếm
                                </button>
                                <button (click)="add()" type="button" class="btn btn-success btn-sm mr-3">
                                    <i class="fas fa-plus"></i> Thêm mới
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-body p-0">
                    <p-treeTable [value]="treeNodes">
                        <ng-template pTemplate="header">
                            <tr>
                                <th class="headerTable">Mã</th>
                                <th class="headerTable">Tên</th>
                                <th class="headerTable">Level</th>
                                <th class="headerTable" style="width: 10%">Thao tác</th>
                            </tr>

                        </ng-template>
                        <ng-template pTemplate="body" let-rowNode let-rowData="rowData">
                            <tr>
                                <td>
                                    <p-treeTableToggler [rowNode]="rowNode"></p-treeTableToggler>
                                    {{rowData.Name}}
                                </td>
                                <td>{{rowData.Description}}</td>
                                <td>{{rowData.RoleLevel}}</td>
                                <td style="text-align: center;"> 
                                    <div class="btn-group">
                                        <button class="btn btn-info dropdown-toggle" type="button"
                                            id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true"
                                            aria-expanded="false">
                                            Thao tác
                                        </button>
                                        <div class="dropdown-menu" role="menu">
                                            <a *ngIf="checkPermission('Edit')" class="dropdown-item" (click)="edit(rowData)">Cập nhật</a>
                                            <a *ngIf="checkPermission('Edit')" class="dropdown-item" (click)="menu(rowData)">Menu</a>
                                            <a *ngIf="checkPermission('Delete')" class="dropdown-item" (click)="delete(rowData)">Xoá</a>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </ng-template>
                    </p-treeTable>

                </div>
            </div>
        </div>
    </div>
</section>
<p-confirmDialog header="Xác nhận" icon="pi pi-exclamation-triangle"></p-confirmDialog>
<p-toast></p-toast>
