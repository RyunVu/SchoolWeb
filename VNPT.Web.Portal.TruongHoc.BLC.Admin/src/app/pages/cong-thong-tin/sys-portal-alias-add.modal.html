<!-- <p-toast></p-toast> -->
<div class="card card-primary">
    <div class="card-body">
        <div class="col-md-12 allow-overflow">
            <div class="form-group">
                <label for="Name">Tên miền<span class="text-danger">(*)</span></label>
                <input type="text" class="form-control" [(ngModel)]="defaultTenMien">
            </div>

            <div class="form-group">
                <label for="Name">Giao thức</label>
                <p-select [options]="giaoThucs" [(ngModel)]="giaoThuc" optionLabel="Name" optionValue="Id"
                    [filter]="true" filterBy="Name" appendTo="body">
                </p-select>
            </div>

            <div class="form-group">
                <label for="Name">Đơn vị</label>
                <p-select [options]="donVis" [(ngModel)]="donVi" optionLabel="Name" optionValue="Id" [filter]="true"
                    filterBy="Name" appendTo="body">
                </p-select>
            </div>

            <div class="form-group">
                <p-checkbox [(ngModel)]="defaultTrangChinh" [binary]="true" inputId="isTrangChinh">
                </p-checkbox>
                <label for="isTrangChinh" style="padding: 0px 0px 0px 10px;"> Trang chính</label>
            </div>
        </div>
    </div>
</div>

<div class="p-footer">
    <div class="f-contains">
        <button class="btn btn-info" type="submit" (click)="submit()">Lưu thay đổi</button>
        <button class="btn btn-outline-danger" type="submit" (click)="cancel()">Thoát</button>
    </div>
</div>
