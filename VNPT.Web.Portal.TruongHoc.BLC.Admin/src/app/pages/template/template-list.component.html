<div class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h4 class="m-0 text-dark">Danh sách biểu mẫu</h4>
            </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item"><a href="#">Home</a></li>
                    <li class="breadcrumb-item active">Biểu mẫu</li>
                </ol>
            </div>
        </div>
    </div>
</div>

<section class="content">

    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-12 col-12">
                <div class="card card-primary card-outline">
                    <div class="card-header">
                        <div class="row">
                            <!-- <div class="col-2">
                                <div class="form-group">
                                    <label for="Name">Đơn vị</label>
                                    <p-dropdown [options]="units" [(ngModel)]="unit" optionLabel="Name"
                                        optionValue="Code" [filter]="true" filterBy="Name" placeholder="Chọn đơn vị"
                                        appendTo="body">
                                    </p-dropdown>
                                </div>
                            </div> -->

                            <div *ngIf="authService.isSuperAdmin()" class="col-3">
                                <div class="form-group">
                                    <label for="unit">Đơn vị</label>
                                    <unit-selector inputId="unit" [(ngModel)]="unitCode"></unit-selector>
                                </div>
                            </div>
                            <div class="col-7">
                                <div class="form-group">
                                    <label for="Name">Từ khóa tìm kiếm</label>
                                    <input type="text" class="form-control" [(ngModel)]="keywordInput"
                                        placeholder="Từ khóa tìm kiếm" />
                                </div>
                            </div>
                            <div class="col-2" style="padding-top: 37px;">
                                <button (click)="search()" type="button" class="btn btn-info btn-sm"
                                    style="margin-right: 5px;">
                                    <i class="fa fa-filter"></i> Tìm kiếm
                                </button>
                                <button (click)="add()" type="button" class="btn btn-success btn-sm mr-3">
                                    <i class="fas fa-plus"></i> Thêm mới
                                </button>
                                <!-- <button (click)="add()" type="button" class="btn btn-success btn-sm mr-3">
                                    <i class="fas fa-plus"></i> Thêm mới
                                </button> -->
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-body p-0">
                    <p-table #dt [value]="list" [lazy]="true" (onLazyLoad)="paginate($event)" [paginator]="true"
                        [rows]="pageSize" [rowsPerPageOptions]="[20,50,100,500,1000]" [totalRecords]="totalRow"
                        [loading]="loading">
                        <ng-template pTemplate="header">
                            <tr>
                                <th class="headerTable" width="5%">Thứ tự</th>
                                <th class="headerTable" width="45%">Tên</th>
                                <!-- <th class="headerTable" width="30%">Đơn vị</th> -->
                                <th class="headerTable" width="10%">Loại</th>
                                <th class="headerTable" width="10%">Thao tác</th>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="body" let-item let-i="rowIndex">
                            <tr>
                                <td>{{i + 1}}</td>
                                <td>{{item.Name}}</td>
                                <!-- <td></td> -->
                                <td>{{item.Type}}</td>
                                <td style="text-align: center;">
                                    <div class="dropdown">
                                        <button class="btn btn-info dropdown-toggle" type="button"
                                            id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true"
                                            aria-expanded="false">
                                            Thao tác
                                        </button>
                                        <div class="dropdown-menu" role="menu">
                                            <a *ngIf="checkPermission('Edit')" class="dropdown-item"
                                                (click)="edit(item)">Cập nhật</a>
                                            <a *ngIf="checkPermission('Edit')" class="dropdown-item"
                                                (click)="input(item)">Nhập liệu</a>
                                            <div class="dropdown-divider"></div>
                                            <a *ngIf="checkPermission('Delete')" class="dropdown-item"
                                                (click)="delete(item)">Xoá</a>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="emptymessage">
                            <tr>
                                <td colspan="3">No items found.</td>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="paginatorleft" let-state>
                            <span>Tổng cộng: {{state.totalRecords}}</span>
                        </ng-template>
                    </p-table>
                </div>
            </div>
        </div>
    </div>
</section>
<p-confirmDialog header="Xác nhận" icon="pi pi-exclamation-triangle"></p-confirmDialog>
