<div class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h4 class="m-0 text-dark">Quản lý menu</h4>
            </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item"><a href="#">Home</a></li>
                    <li class="breadcrumb-item active">Menus</li>
                </ol>
            </div>
        </div>
    </div>
</div>

<section class="content">

    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-12 col-12">
                <div class="card card-primary card-outline">
                    <div class="card-header">
                        <div class="row">
                            <div class="col-md-2">
                                <div class="form-group">
                                    <label for="DayOfBirth">Vị trí menu</label>
                                    <div>
                                        <p-dropdown optionLabel="Name" optionValue="Id" [filter]="true"
                                            [(ngModel)]="menuPosition" [options]="menuPositions" appendTo="body">
                                        </p-dropdown>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="Name">Từ khóa tìm kiếm</label>
                                    <input type="text" class="form-control" [(ngModel)]="keywordInput"
                                        placeholder="Từ khóa tìm kiếm" />
                                </div>
                            </div>
                            <div class="col-md-2" style="padding-top: 37px;">
                                <button (click)="search()" type="button" class="btn btn-info btn-sm"
                                    style="margin-right: 5px;">
                                    <i class="fa fa-filter"></i> Tìm kiếm
                                </button>
                                <button (click)="add()" type="button" class="btn btn-success btn-sm mr-3">
                                    <i class="fas fa-plus"></i> Thêm mới
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-body p-0">
                    <p-treeTable [value]="treeNodes">
                        <ng-template pTemplate="header">
                            <tr>
                                <th class="headerTable">Tiêu đề</th>
                                <!-- <th class="headerTable" width="10%">Vị trí</th> -->
                                <th class="headerTable" width="8%">Hiển thị</th>
                                <th class="headerTable" width="25%">Action</th>
                                <th class="headerTable" width="15%">Người tạo</th>
                                <th class="headerTable" width="10%">Thao tác</th>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="body" let-rowNode let-rowData="rowData">
                            <tr>
                                <td>
                                    <p-treeTableToggler [rowNode]="rowNode"></p-treeTableToggler>
                                    {{ rowData.OrderNo }}. {{ rowData.Title }}
                                </td>
                                <!-- <td>
                                    {{ getPosition(rowData.MenuPosition) }}
                                </td> -->
                                <td style="text-align: center;">
                                    <i *ngIf="rowData.IsShowMenu == true" class="fa fa-check"></i>
                                </td>
                                <td>
                                    {{ rowData.Action }}
                                    <span *ngIf="rowData.Parameter">({{ rowData.Parameter }})</span>
                                </td>
                                <td style="text-align: center;">
                                    {{rowData.CreateUserName}}<br>
                                    {{rowData.CreateDate}}
                                </td>
                                <td style="text-align: center;">
                                    <button pbutton="" pripple="" icon="pi pi-pencil" (click)="edit(rowData)" title="Chỉnh sửa menu"
                                        *ngIf="checkPermission('Edit')"
                                        class="p-element p-button-rounded p-button-success mr-2 p-button p-component p-button-icon-only">
                                        <span class="p-button-icon pi pi-pencil" aria-hidden="true"></span>
                                    </button>

                                    <button pbutton="" pripple="" icon="pi pi-trash" (click)="delete(rowData)" title="Xóa menu"
                                        *ngIf="checkPermission('Delete')"
                                        class="p-element p-button-rounded p-button-warning mr-2 p-button p-component p-button-icon-only">
                                        <span class="p-button-icon pi pi-trash" aria-hidden="true"></span>
                                    </button>
                                    <!-- <button pbutton="" pripple="" icon="fas fa-history" (click)="history(rowData)" title="Lịch sử chỉnh sửa"
                                        class="p-element p-button-rounded p-button-warning mr-2 p-button p-component p-button-icon-only mt-2">
                                        <span class="p-button-icon fas fa-history" aria-hidden="true"></span>
                                    </button> -->

                                </td>
                            </tr>
                        </ng-template>
                    </p-treeTable>
                </div>
            </div>
        </div>
    </div>
</section>
<p-confirmDialog header="Xác nhận" icon="pi pi-exclamation-triangle"></p-confirmDialog>
<p-toast></p-toast>
