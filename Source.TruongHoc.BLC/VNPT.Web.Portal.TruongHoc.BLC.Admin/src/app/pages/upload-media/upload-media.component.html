<div class="content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-6">
        <h4 class="m-0 text-dark">Tham số media</h4>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-right">
          <li class="breadcrumb-item"><a href="#">Home</a></li>
          <li class="breadcrumb-item active">Tham số media</li>
        </ol>
      </div>
    </div>
  </div>
</div>

    <div class="row">

        <div class="card card-primary card-outline">
          <div class="card-header">
            <div class="row">

              <div [ngClass]="isSuperAdminSystem ? 'col-md-4' : 'col-md-6'">
                <div class="form-group">
                  <label for="Name">Từ khóa tìm kiếm</label>
                  <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="keywordInput"
                    placeholder="Từ khóa tìm kiếm"
                  />
                </div>
              </div>
              <div class="col-md-2" style="padding-top: 37px">
                <button
                  (click)="search()" 
                  type="button"
                  class="btn btn-info btn-sm"
                  style="margin-right: 5px"
                >
                  <i class="fa fa-filter"></i> Tìm kiếm
                </button>

                <!-- <button
                  (click)="add()"
                  type="button"
                  class="btn btn-success btn-sm"

                  <i class="fa fa-plus"></i> Thêm mới
                </button> -->
              </div>
            </div>
          </div>
        </div>
        <div class="card-body p-0">
          <p-table
            #dt
            [responsive]="true"
            [value]="items"
            [lazy]="true"
            (onLazyLoad)="paginate($event)"
            [paginator]="true"
            [rows]="pageSize"
            [rowsPerPageOptions]="[20, 50, 100, 500, 1000]"
            [totalRecords]="totalRow"
            [loading]="loading"
            responsiveLayout="scroll"
          >
            <ng-template pTemplate="header">
              <tr>
                <th class="headerTable" style="width: 5%; text-align: center">
                  STT
                </th>
                <th class="headerTable" style="width: 40%">Tên tham số</th>
                <th class="headerTable" style="width: 40%">Tên file</th>
                <th class="headerTable" style="width: 150px">Thao tác</th>
              </tr>
            </ng-template>
            <ng-template pTemplate="body" let-rowData let-i="rowIndex">
              <tr>
                <td style="text-align: center">{{ i + 1 }}</td>
                <td class="text-left">{{ rowData.Name }}</td>
                <td class="text-left">{{ rowData.Value2 }}</td>
                <td style="text-align: center">
                  <button (click)="edit(rowData)" class="btn btn-info">
                      Cập nhập
                    </button>
                </td>
              </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
              <tr>
                <td colspan="4">No items found.</td>
              </tr>
            </ng-template>
          </p-table>
        </div>
      </div>
    </div>
  </div>
</section>
<p-confirmDialog
  header="Xác nhận"
  icon="pi pi-exclamation-triangle"
></p-confirmDialog>
