<div class="row">
    <div class="col-md-2">
        <div class="form-group">
            <label for="Name">Loại tin tức:</label>
            <input type="text" class="form-control" [(ngModel)]="loaiTinTuc" placeholder="Alias" [readonly]="true" />
        </div>
    </div>
    <div class="col-md-5" *ngIf="!parent.isNewsImage">
        <div class="form-group">
            <label for="Name">Alias: </label>
            <input type="text" class="form-control" [(ngModel)]="defaultAlias" placeholder="Alias" [readonly]="true" />
        </div>
    </div>
    <div class="col-md-3" *ngIf="parent.isNewsImage">
        <div class="form-group">
            <label for="Name">Url</label>
            <input type="text" class="form-control" [(ngModel)]="defaultUrl" placeholder="Url" [readonly]="true" />
        </div>
    </div>
    <div class="col-md-2" *ngIf="parent.isNewsImage">
        <div class="form-group">
            <label for="Parameter">Mở ra trang mới</label>
            <p-checkbox [binary]="true" [(ngModel)]="defaultIsOpenBlankPage" [readonly]="true"></p-checkbox>
        </div>
    </div>
    <div class="col-md-2">
        <div class="form-group">
            <label for="Name">Ngày đăng</label>
            <p-calendar [(ngModel)]="defaultNgay" [showIcon]="true" dateFormat="dd/mm/yy" hourFormat="24"
                disabled="true" [showTime]="true" [showSeconds]="true" appendTo="body"></p-calendar>
        </div>
    </div>

    <div class="col-md-1">
        <div class="form-group">
            <label for="Name">Ảnh đại diện</label>
        </div>
    </div>
    <div class="col-md-2">
        <div class="form-group">
            <div class="row-custom">
                <div style="background-color: #ececec; width: 100px; height: 100px; padding: 10px;">
                    <img [src]="imageUrl | imageUrlPipe: 'thumb'" style="width: 100%; height: 100%" />
                </div>
            </div>
        </div>
    </div>

    <div *ngIf="!paramEnableLanguage">
        <div class="col-md-12">
            <div class="form-group">
                <label for="Name">Tiêu đề</label>
                <input type="text" class="form-control" (keyup)="changeAlias($event)" [(ngModel)]="defaultTitle"
                    placeholder="Tiêu đề" [readonly]="true" />
            </div>
        </div>
        <div class="col-md-12" *ngIf="!parent.isNewsImage">
            <div class="form-group">
                <label for="Name">Nội dung <span class="text-danger">(*)</span></label>
                <div [innerHtml]="defaultContent">
                </div>
            </div>
        </div>
    </div>


    <div *ngIf="paramEnableLanguage" class="col-md-12">
        <p-tabView>
            <p-tabPanel header="Tiếng Việt">
                <div class="col-md-12">
                    <div class="form-group">
                        <label for="Name">Tiêu đề <span class="text-danger">(*)</span></label>
                        <input type="text" class="form-control" (keyup)="changeAlias($event)" [(ngModel)]="defaultTitle"
                            placeholder="Tiêu đề" [readonly]="true" />
                    </div>
                </div>
                <div class="col-md-12" *ngIf="!parent.isNewsImage">
                    <div class="form-group">
                        <label for="Name">Nội dung <span class="text-danger">(*)</span></label>
                        <div [innerHtml]="defaultContent">
                        </div>
                    </div>
                </div>
            </p-tabPanel>
            <p-tabPanel header="Tiếng Anh">
                <div class="col-md-12">
                    <div class="form-group">
                        <label for="Name">Tiêu đề</label>
                        <input type="text" class="form-control" [(ngModel)]="defaultTitle_En" placeholder="Tiêu đề"
                            [readonly]="true" />
                    </div>
                </div>
                <div class="col-md-12" *ngIf="!parent.isNewsImage">
                    <div class="form-group">
                        <label for="Name">Nội dung</label>
                        <div [innerHtml]="defaultContent_En">
                        </div>
                    </div>
                </div>
            </p-tabPanel>
        </p-tabView>
    </div>
</div>

<div class="p-footer">
    <div class="f-contains">
        <button class="btn {{item.Status == 1 ? 'btn-danger' : 'btn-success'}}" type="submit" (click)="submit()">
            {{item.Status == 1? 'Bỏ Duyệt' : 'Duyệt'}}
        </button>
        <button class="btn btn-outline-danger" type="submit" (click)="cancel()">
            Thoát
        </button>
    </div>
</div>
