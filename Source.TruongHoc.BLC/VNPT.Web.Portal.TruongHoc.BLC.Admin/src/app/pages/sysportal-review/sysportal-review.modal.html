<div class="row">
    <div id="reviewInput" class="col-md-12 overflow: scroll;" style="overflow-y: scroll; height: 300px;">
        <ul class="timeline">
            <li>
                <i class="fa fa-envelope" style="color:#fff"
                    [style.background-color]="getColor(item.CreateUserId)"></i>
                <div class="timeline-item">
                    <span class="time">
                        <button [disabled]="!config.data.IsAdd" type="button" class="btn btn-box-tool"
                            (click)="showApprove(item,-1,true)">
                            <i style="color:red" class="fa fa-trash-o"></i>
                        </button>
                        <i class="fa fa-clock"></i> {{item.CreateDate | date:"dd/MM/yyyy HH:mm"}}
                    </span>
                    <h3 class="timeline-header">
                        <button [disabled]="!config.data.IsAdd" type="button"
                            title="{{item.Status == 3 ? 'Mở khóa': 'Khóa'}} chủ đề" class="btn btn-box-tool"
                            (click)="showApprove(item,item.Status,true)">
                            <i style="color: red" class="fa {{item.Status == 3 ? 'fa-lock': 'fa-unlock'}}"></i>
                        </button>
                        <button [disabled]="!config.data.IsAdd" type="button" class="btn btn-box-tool"
                            (click)="showApprove(item,item.Status === 2 ? oldStatus : 2 ,true, item.Status === 2 ? true : false, oldStatus)"
                            title="{{item.Status === 2  ?  'Mở lại chủ đề' : 'Hoàn tất chủ đề'}}">
                            <i style="color:green"
                                class="fa {{item.Status == 2 ? 'fa-square': 'fa-check-square'}}"></i>
                        </button>
                        <a [style.color]="getColor(item.CreateUserId)">{{item.Name}}</a>
                    </h3>
                    <div class="timeline-body">
                        <p style="margin: 0;">
                            {{item.Content}}
                        </p>
                    </div>
                </div>
            </li>

            <li *ngFor="let item of listItem">
                <i class="fa fa-envelope" style="color:#fff" [style.background-color]="getColor(item.Name)"></i>
                <div class="timeline-item">
                    <span class="time">
                        <i class="fa fa-clock"></i> {{item.CreateDate | date:"dd/MM/yyyy HH:mm"}}
                        <button [disabled]="!config.data.IsAdd" type="button" class="btn btn-box-tool"
                            (click)="showApprove(item,-1)">
                            <i style="color: red" class="fa fa-trash"></i>
                        </button>
                    </span>

                    <h3 class="timeline-header">
                        <button [disabled]="!config.data.IsAdd" type="button" class="btn btn-box-tool"
                            (click)="showApprove(item,item.Status)">
                            <i style="color: red" class="fa {{item.Status == 3 ? 'fa-lock': 'fa-unlock'}}"></i>
                        </button>
                        <a [style.color]="getColor(item.Name)">{{item.Name}}</a>
                    </h3>

                    <div class="timeline-body">
                        <p style="margin: 0;" [innerHTML]="item.Content">
                        </p>
                    </div>
                </div>
            </li>
            <li>
                <i class="fa fa-clock bg-gray"></i>
            </li>
        </ul>
    </div>
    
    <div class="col-md-12" style="margin-top: 30px;">
        <div class="form-group">
            <label for="Name">Trả lời <span class="text-danger">(*)</span></label>
            <ckeditor [rows]="500" [value]="defaultContent" (onEditorKeyup)="changeContent($event)">

            </ckeditor>
        </div>
    </div>

</div>

<div class="p-footer">
    <div class="f-contains">
        <button class="btn bg-pro color-white" type="submit" (click)="submit()">
            Gửi
        </button>
        <button class="btn btn-outline-danger" type="submit" (click)="cancel()">
            Thoát
        </button>
    </div>
</div>
