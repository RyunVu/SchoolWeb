<div class="row">
    <div class="col-md-4">
        <div class="form-group">
            <label for="Name">Đơn vị</label>
            <p-dropdown [options]="units" [(ngModel)]="unit" optionLabel="Name" optionValue="Code" [filter]="true"
                filterBy="Name" placeholder="Chọn đơn vị" appendTo="body">
            </p-dropdown>
        </div>
    </div>
    <div class="col-md-4">
        <div class="form-group">
            <label for="Name">Tên</label>
            <input type="text" class="form-control" [(ngModel)]="item.Name" placeholder="Tên" />
        </div>
    </div>
    <!-- <div class="col-md-4">
        <div class="form-group">
            <label for="Name">Tên tiếng anh</label>
            <input type="text" class="form-control" [(ngModel)]="item.Name_En" placeholder="Tên tiếng anh" />
        </div>
    </div> -->
    <div class="col-md-6">
        <div class="form-group">
            <label for="Name">Giá trị 1</label>
            <input type="text" class="form-control" [(ngModel)]="item.Value" placeholder="Giá trị 1" />
        </div>
    </div>
    <div class="col-md-6">
        <div class="form-group">
            <label for="Name">Giá trị 2</label>
            <input type="text" class="form-control" [(ngModel)]="item.Value2" placeholder="Giá trị 2" />
        </div>
    </div>

    <div class="col-md-6">
        <div class="form-group">
            <label for="Name">Mô tả</label>
            <textarea class="form-control" [(ngModel)]="item.Description" rows="7" placeholder="Mô tả"></textarea>
        </div>
    </div>
    <div class="col-md-6">
        <div class="row-custom"><b>Hình ảnh</b></div>
        <div class="row-custom">
            <div class="btn bg-pro color-white" (click)="openFileDilog()">
                Chọn hình ảnh
            </div>
        </div>
        <div class="row-custom">
            <div style="
        background-color: #ececec;
        width: 100px;
        height: 100px;
        padding: 10px;
      ">
                <img [src]="imageUrl | imageUrlPipe: 'thumb'" style="width: 100%; height: 100%" />
            </div>
        </div>
    </div>
</div>

<div class="p-footer">
    <div class="f-contains">
        <button class="btn btn-info" type="submit" (click)="submit()">
            Lưu thay đổi
        </button>
        <button class="btn btn-outline-danger" type="submit" (click)="cancel()">
            Thoát
        </button>
    </div>
</div>
