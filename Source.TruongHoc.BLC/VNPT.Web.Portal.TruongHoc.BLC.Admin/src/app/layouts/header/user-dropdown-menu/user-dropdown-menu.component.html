<li class="nav-item dropdown user-menu">
  <a class="nav-link dropdown-toggle" data-toggle="dropdown" (click)="toggleDropdownMenu()">
    <!-- <img
      [src]="user.AvatarUrl"
      class="user-image img-circle elevation-2"
      alt="User Image"
    /> -->
    {{ user.FullName }}
  </a>
  <ul #dropdownMenu class="dropdown-menu dropdown-menu-lg dropdown-menu-right">
    <li class="user-header bg-primary">
      <img [src]="user.AvatarUrl" class="img-circle elevation-2" alt="User Image" />
      <p>
        {{ user.LastName }} {{ user.FirstName }}
        <small *ngIf="user.PositionName">Chức vụ: {{ user.PositionName }}</small>
        <small *ngIf="user.UnitName">Đơn vị: {{ user.UnitName }}</small>
      </p>
    </li>
    <li class="user-footer">
      <div class="pull-left">
        <a class="btn btn-xs btn-warning mr-3" (click)="xm2Lop()">
          BM 2 lớp
        </a>
        <a class="btn btn-xs btn-info mr-3" (click)="changePass()">
          Đổi Mật Khẩu
        </a>
      </div>
      <div class="pull-right">
        <a (click)="logout()" class="btn  btn-xs btn-danger">Đăng Xuất</a>
      </div>
    </li>
  </ul>
</li>

<p-dialog header="Đổi Mật Khẩu" [(visible)]="displayModal" [modal]="true" [style]="{'width': '400px'}"
  [baseZIndex]="10000" [draggable]="false" [resizable]="false">
  <form [formGroup]="updateForm" (ngSubmit)="saveChangePass()">
    <div class="p-fluid p-formgrid p-grid">
      <div class="p-field p-col-12 p-md-12">
        <label for="OldPassword">Mật khẩu cũ(*): </label>
        <input id="OldPassword" formControlName="OldPassword" type="password" required="true" pInputText>
      </div>
      <div class="p-field p-col-12 p-md-12">
        <label for="NewPassword">Mật khẩu mới: </label>
        <input id="NewPassword" formControlName="NewPassword" type="password" required="true" pInputText>
      </div>
      <div class="p-field p-col-12 p-md-12">
        <label for="ConfirmPassword">Xác nhận mật khẩu mới: </label>
        <input id="ConfirmPassword" formControlName="ConfirmPassword" type="password" required="true" pInputText>
      </div>
      <div class="p-field p-col-12" style="text-align: right;">
        <p-button type="submit" label="Lưu" [disabled]="loading">
          <img *ngIf="loading"
            src="data:image/gif;base64,R0lGODlhEAAQAPIAAP///wAAAMLCwkJCQgAAAGJiYoKCgpKSkiH/C05FVFNDQVBFMi4wAwEAAAAh/hpDcmVhdGVkIHdpdGggYWpheGxvYWQuaW5mbwAh+QQJCgAAACwAAAAAEAAQAAADMwi63P4wyklrE2MIOggZnAdOmGYJRbExwroUmcG2LmDEwnHQLVsYOd2mBzkYDAdKa+dIAAAh+QQJCgAAACwAAAAAEAAQAAADNAi63P5OjCEgG4QMu7DmikRxQlFUYDEZIGBMRVsaqHwctXXf7WEYB4Ag1xjihkMZsiUkKhIAIfkECQoAAAAsAAAAABAAEAAAAzYIujIjK8pByJDMlFYvBoVjHA70GU7xSUJhmKtwHPAKzLO9HMaoKwJZ7Rf8AYPDDzKpZBqfvwQAIfkECQoAAAAsAAAAABAAEAAAAzMIumIlK8oyhpHsnFZfhYumCYUhDAQxRIdhHBGqRoKw0R8DYlJd8z0fMDgsGo/IpHI5TAAAIfkECQoAAAAsAAAAABAAEAAAAzIIunInK0rnZBTwGPNMgQwmdsNgXGJUlIWEuR5oWUIpz8pAEAMe6TwfwyYsGo/IpFKSAAAh+QQJCgAAACwAAAAAEAAQAAADMwi6IMKQORfjdOe82p4wGccc4CEuQradylesojEMBgsUc2G7sDX3lQGBMLAJibufbSlKAAAh+QQJCgAAACwAAAAAEAAQAAADMgi63P7wCRHZnFVdmgHu2nFwlWCI3WGc3TSWhUFGxTAUkGCbtgENBMJAEJsxgMLWzpEAACH5BAkKAAAALAAAAAAQABAAAAMyCLrc/jDKSatlQtScKdceCAjDII7HcQ4EMTCpyrCuUBjCYRgHVtqlAiB1YhiCnlsRkAAAOwAAAAAAAAAAAA==" />

</p-dialog>

<p-dialog header="Xác minh 2 lớp" [(visible)]="displayF2aModal" [modal]="true" [style]="{'width': '400px'}"
  [baseZIndex]="10000" [draggable]="false" [resizable]="false">
  <form [formGroup]="f2aForm" (ngSubmit)="getImageF2a()">
    <div *ngIf="imageUrl">
      <img [src]="imageUrl" style="width: 100%;">
      <p>Sử dụng ứng dụng Google Authenticator hoặc Microsoft Authenticator để quét</p>
      <p style="word-wrap: break-word;">Khóa: {{keyQr}}</p>
    </div>
    <div class="p-fluid p-formgrid p-grid" *ngIf="!imageUrl">
      <div class="p-field p-col-12 p-md-12">
        <label for="Password">Mật khẩu: </label>
        <input id="Password" formControlName="Password" type="password" required="true" pInputText>
      </div>
      <div class="p-field p-col-12" style="text-align: right;">
        <p-button type="submit" label="Lấy ảnh" [disabled]="loading">
          <img *ngIf="loading"
            src="data:image/gif;base64,R0lGODlhEAAQAPIAAP///wAAAMLCwkJCQgAAAGJiYoKCgpKSkiH/C05FVFNDQVBFMi4wAwEAAAAh/hpDcmVhdGVkIHdpdGggYWpheGxvYWQuaW5mbwAh+QQJCgAAACwAAAAAEAAQAAADMwi63P4wyklrE2MIOggZnAdOmGYJRbExwroUmcG2LmDEwnHQLVsYOd2mBzkYDAdKa+dIAAAh+QQJCgAAACwAAAAAEAAQAAADNAi63P5OjCEgG4QMu7DmikRxQlFUYDEZIGBMRVsaqHwctXXf7WEYB4Ag1xjihkMZsiUkKhIAIfkECQoAAAAsAAAAABAAEAAAAzYIujIjK8pByJDMlFYvBoVjHA70GU7xSUJhmKtwHPAKzLO9HMaoKwJZ7Rf8AYPDDzKpZBqfvwQAIfkECQoAAAAsAAAAABAAEAAAAzMIumIlK8oyhpHsnFZfhYumCYUhDAQxRIdhHBGqRoKw0R8DYlJd8z0fMDgsGo/IpHI5TAAAIfkECQoAAAAsAAAAABAAEAAAAzIIunInK0rnZBTwGPNMgQwmdsNgXGJUlIWEuR5oWUIpz8pAEAMe6TwfwyYsGo/IpFKSAAAh+QQJCgAAACwAAAAAEAAQAAADMwi6IMKQORfjdOe82p4wGccc4CEuQradylesojEMBgsUc2G7sDX3lQGBMLAJibufbSlKAAAh+QQJCgAAACwAAAAAEAAQAAADMgi63P7wCRHZnFVdmgHu2nFwlWCI3WGc3TSWhUFGxTAUkGCbtgENBMJAEJsxgMLWzpEAACH5BAkKAAAALAAAAAAQABAAAAMyCLrc/jDKSatlQtScKdceCAjDII7HcQ4EMTCpyrCuUBjCYRgHVtqlAiB1YhiCnlsRkAAAOwAAAAAAAAAAAA==" />
