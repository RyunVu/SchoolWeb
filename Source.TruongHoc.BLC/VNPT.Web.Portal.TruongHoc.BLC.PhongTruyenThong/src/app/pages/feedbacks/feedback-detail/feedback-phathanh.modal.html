<!-- <p-toast></p-toast> -->
<div class="row">
    <div class="col-md-12">
        <div class="form-group">
            <label for="Name">Nội dung trả lời <span class="text-danger">(*)</span></label>
            <ckeditor [value]="command" [defaultFolder]="images" [rows]="500" (onEditorKeyup)="changeContent($event)">
            </ckeditor>
        </div>
    </div>
</div>

<div class="p-footer">
    <div class="f-contains">
        <button class="btn bg-pro color-white" type="submit" (click)="save()">Lưu</button>
        <button class="btn btn-outline-danger" type="submit" (click)="cancel()">Thoát</button>
    </div>
</div>
