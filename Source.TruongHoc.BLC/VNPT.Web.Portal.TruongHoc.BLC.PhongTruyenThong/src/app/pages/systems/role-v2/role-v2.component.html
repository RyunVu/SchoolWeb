<div class="content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-6">
        <h1 class="m-0 text-dark">Quản lý quyền</h1>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-right">
          <li class="breadcrumb-item"><a href="#">Home</a></li>
          <li class="breadcrumb-item active">Roles</li>
        </ol>
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-lg-6 col-md-6 col-xs-12">
        <div class="card card-primary card-outline">
          <div class="card-header">
            <h3 class="card-title">Danh sách quyền</h3>
            <button *ngIf="checkPermission('Add')" (click)="add()" type="button"
              class="btn btn-info btn-sm float-right">
              <i class="fas fa-plus"></i> Thêm mới
            </button>
          </div>
          <div class="card-body p-0">
            <p-treeTable [value]="treeNodes" [autoLayout]="true">
              <ng-template pTemplate="header">
                <tr>
                  <th width="70%" style="text-align: center">Tên</th>
                  <th width="30%" style="text-align: center">Thao tác</th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-rowNode let-rowData="rowData">
                <tr>
                  <td>{{ rowData.Description }}</td>
                  <td style="text-align: center">
                    <button style="margin-right: 10px" type="button" class="btn btn-info btn-sm"
                      *ngIf="checkPermission('Edit')" (click)="user(rowData)">
                      <i class="fas fa-user"></i>
                    </button>
                    <button style="margin-right: 10px" type="button" class="btn btn-info btn-sm"
                      *ngIf="checkPermission('Edit')" (click)="openMenu(rowData)">
                      <i class="fas fa-bars"></i>
                    </button>
                    <button style="margin-right: 10px" type="button" class="btn btn-warning btn-sm text-default"
                      *ngIf="checkPermission('Edit')" (click)="edit(rowData)">
                      <i class="fas fa-wrench"></i>
                    </button>
                    <button style="margin-right: 10px" type="button" class="btn btn-danger btn-sm"
                      *ngIf="checkPermission('Delete')" (click)="delete(rowData)">
                      <i class="fas fa-trash"></i>
                    </button>
                  </td>
                </tr>
              </ng-template>
            </p-treeTable>
          </div>
        </div>
      </div>
      <div class="col-lg-6 col-md-6 col-xs-12" [hidden]="IsHide">
        <div class="card card-primary">
          <div class="card-body">
            <div class="col-sm-6">
              <h2 class="m-0 text-dark">
                {{ menuId ? menuId.Description : '' }}
              </h2>
            </div>
            <p-tree [value]="treeNodesMenu" [loading]="loadingTree" selectionMode="checkbox" [filter]="true"
              filterMode="strict" filterBy="data.Title" [(selection)]="selectedFiles">
              <ng-template let-node pTemplate="default">
                <b>{{ node.data.OrderNoShow }} {{ node.data.Title }}</b>
              </ng-template>
            </p-tree>
            <div class="p-footer">
              <div class="f-contains" style="text-align: center;">
                <button class="btn btn-primary" type="submit" (click)="submit()">
                  Lưu thay đổi
                </button>
                <button class="btn btn-outline-danger ml-3" type="submit" (click)="exit()">
                  Thoát
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<p-confirmDialog header="Xác nhận" icon="pi pi-exclamation-triangle"></p-confirmDialog>
<p-toast></p-toast>
