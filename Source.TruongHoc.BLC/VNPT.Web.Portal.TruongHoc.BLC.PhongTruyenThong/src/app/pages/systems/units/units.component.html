<!-- <p-toast [style]="{marginTop: '80px'}"></p-toast> -->
<div class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1 class="m-0 text-dark">Quản lý đơn vị</h1>
            </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item"><a href="#">Home</a></li>
                    <li class="breadcrumb-item active">Đơn vị</li>
                </ol>
            </div>
        </div>
    </div>
</div>

<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-12 col-12">
                <div class="card">
                    <div class="card-header">
                        <div class="row">
                            <div class="col-md-6">
                                <h3 class="card-title">Danh sách đơn vị</h3>
                            </div>
                            <div class="col-md-6">
                                <button *ngIf="checkPermission('Add')" (click)="add()" type="button" class="btn btn-info btn-sm float-right">
                                    <i class="fas fa-plus"></i> Thêm mới
                                </button>

                            </div>
                        </div>
                    </div>
                    <div class="collapse show" id="collapseExample">
                        <div class="card card-body">
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="Name">Từ khóa tìm kiếm</label>
                                        <input type="text" class="form-control" [(ngModel)]="keywordInput" placeholder="Từ khóa tìm kiếm">
                                    </div>
                                </div>
                                <div class="col-md-2" *ngIf="isShow">
                                    <div class="form-group">
                                        <p-checkbox [(ngModel)]="isUBND" [binary]="true" label="UBND"></p-checkbox>
                                    </div>
                                </div>
                            </div>
                            <div class="row mt-2">
                                <div class="col-md-12">
                                    <button (click)="search()" type="button" class="btn btn-info btn-sm float-right">
                                        <i class="fa fa-filter"></i> Tìm kiếm
                                    </button>

                                    <button (click)="showHide()" type="button" class="btn btn-outline-{{isShow ? 'secondary' : 'primary'}} btn-sm float-left">
                                        <i class="fa fa-cogs"></i> {{isShow ? 'Thu gọn tìm kiếm' : 'Mở rộng tìm kiếm'}} 
                                     </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <p-table #dt [showCurrentPageReport]="true" currentPageReportTemplate="Hiển thị {first} đến {last} trong tổng số {totalRecords} mục" [value]="items" [lazy]="true" (onLazyLoad)="paginate($event)" [paginator]="true" [rows]="10" [totalRecords]="totalRow"
                            [loading]="loading" [autoLayout]="true">
                            <ng-template pTemplate="header">
                                <tr>
                                    <th>Tên đơn vị</th>
                                    <th>Mã đơn vị</th>
                                    <th>Khu vực</th>
                                    <th>Mô tả</th>
                                    <th style="width: 10rem">Thao tác</th>
                                </tr>
                            </ng-template>
                            <ng-template pTemplate="body" let-unit>
                                <tr>
                                    <td>
                                        {{unit.Name}}
                                    </td>
                                    <td>
                                        {{unit.Code}}
                                    </td>
                                    <td>
                                        <span *ngIf="unit.DistristName != null">Huyện/Tp: {{unit.DistristName}}</span><br/>
                                        <span *ngIf="unit.WardName != null">Phường/Xã: {{unit.WardName}}</span>
                                    </td>
                                    <td>
                                        {{unit.Description}}
                                    </td>
                                    <td>
                                        <div class="btn-group">
                                            <button type="button" class="btn btn-info" *ngIf="checkPermission('Edit')" (click)="edit(unit)">Cập nhật</button>
                                            <button type="button" class="btn btn-warning dropdown-toggle dropdown-icon" data-toggle="dropdown">
                                                <span class="sr-only"></span>
                                                </button>
                                            <div class="dropdown-menu" role="menu">
                                                <a class="dropdown-item" (click)="delete(unit)" *ngIf="checkPermission('Delete')">Xóa</a>
                                                <div class="dropdown-divider"></div>
                                                <a *ngIf="checkPermission('View')" class="dropdown-item" (click)="history(unit)">Lịch sử thay đổi</a>
                                            </div>
                                        </div>

                                    </td>
                                </tr>
                            </ng-template>
                            <ng-template pTemplate="emptymessage">
                                <tr>
                                    <td colspan="3">Không tìm thấy dữ liệu</td>
                                </tr>
                            </ng-template>
                        </p-table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<p-confirmDialog header="Xác nhận" icon="pi pi-exclamation-triangle"></p-confirmDialog>
