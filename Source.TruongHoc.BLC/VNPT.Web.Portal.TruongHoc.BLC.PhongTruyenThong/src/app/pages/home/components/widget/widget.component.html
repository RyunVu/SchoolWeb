<div class="widget-rounded-circle card">
  <div class="card-body">
    <div class="row">
      <div class="col-3 d-flex align-items-center justify-content-center">
        <i [ngClass]="leftIcon" class="fa fa-2x"></i>
      </div>
      <div class="col-9">
        <div class="text-right">
          <h3 class="text-dark mt-1">
            {{ title }}
          </h3>
          <p class="text-muted mb-1 text-truncate">{{ subTitle }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
