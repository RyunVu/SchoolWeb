<div class="row">
  <div class="col-md-12">
    <div class="form-send-feedback">
      <span class="note-form"><span class="text-danger">(*)</span> là những nội dung bắt buộc nhập</span>

      <form action="#" class="col-sm-12 row">

        <div class="col-sm-6">
          <div class="form-group">
            <input type="text" placeholder="Tên cơ sở (*)" class="form-control">
            <i class="fa fa-user"></i>
          </div>
        </div>

        <div class="col-sm-6">
          <div class="form-group">
            <input type="text" placeholder="Địa chỉ (*)" class="form-control">
            <i class="fa fa-map-marker"></i>
          </div>
        </div>

        <div class="col-sm-6">
          <div class="form-group">
            <select class="form-control" placeholder="Tỉnh/Thành Phố">
              <option>1</option>
              <option>1</option>
            </select>
            <i class="fa fa-chevron-down" aria-hidden="true"></i>
          </div>
        </div>

        <div class="col-sm-6">
          <div class="form-group">
            <select class="form-control" placeholder="Quận/Huyện">
              <option>1</option>
              <option>1</option>
            </select>
            <i class="fa fa-chevron-down" aria-hidden="true"></i>
          </div>
        </div>

        <div class="col-sm-6">
          <div class="form-group">
            <select class="form-control" placeholder="Xã/Phường">
              <option>1</option>
              <option>1</option>
            </select>
            <i class="fa fa-chevron-down" aria-hidden="true"></i>
          </div>
        </div>

        <div class="col-sm-6">
          <div class="form-group">
            <input type="text" placeholder="Họ tên người gửi" class="form-control">
            <i class="fa fa-user"></i>
          </div>
        </div>

        <div class="col-sm-6">
          <div class="form-group">
            <input type="text" placeholder="Số điện thoại" class="form-control">
            <i class="fa fa-phone" aria-hidden="true"></i>
          </div>
        </div>

        <div class="col-sm-6">
          <div class="form-group">
            <input type="text" placeholder="Địa chỉ" class="form-control">
            <i class="fa fa-map-marker"></i>
          </div>
        </div>
        <div class="col-sm-12">
          <div class="form-group fg-full">
            <textarea rows="8" placeholder="Nội dung cảnh báo (*)" class="form-control"></textarea>
            <i class="fa fa-align-left"></i>
          </div>
        </div>
      </form>
    </div>

  </div>

</div>
<div class="p-footer">
  <div class="f-contains">
    <button class="btn btn-outline-danger" type="submit" (click)="cancel()">
      Thoát
    </button>

    <button class="btn btn-success" type="submit" (click)="cancel()">
      Gửi cảnh báo
    </button>
  </div>
</div>
