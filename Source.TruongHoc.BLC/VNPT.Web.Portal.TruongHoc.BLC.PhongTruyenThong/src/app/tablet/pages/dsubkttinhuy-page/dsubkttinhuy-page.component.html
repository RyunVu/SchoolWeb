<div class="body-content">

  <div class="side_nav">
    <a (click)="backPage()" class="item_nav">
      <i class="fa fa-reply" aria-hidden="true"></i>
    </a>

    <a href="#/tablet" class="item_nav">
      <i class="fa fa-home" aria-hidden="true"></i>
    </a>
  </div>

  <nav id="menu-filter" class="sidenavfilter">

    <div (click)="closeFilter()" class="bg-close"></div>

    <div class="close-menu-filter close-menu" (click)="closeFilter()"><span><i class="fa fa-window-close"
          aria-hidden="true"></i></span></div>

    <div class="filter_action">
      <button class="btn-sm btn btn-outline-secondary"><i class="fas fa-ban"></i> Reset all</button>
      <button class="btn-sm btn btn-success"><i class="fas fa-check"></i> Áp dụng</button>
    </div>

  </nav>

  <div class="container">
    <ng-container *ngFor="let item of lstData">

      <div class="content-title text-center">
        <div class="c-title">{{item.Name}}</div>
      </div>

      <!-- {{item.CBCVNKlst.length == 1 ? 'offset-sm-3':''}} -->

      <div class="lstperson row col-sm-12">
        <div class="col-sm-6 {{item.CBCVNKlst.length == 1 ? 'offset-sm-3':''}}" *ngFor="let itemc of item.CBCVNKlst">
          <div class="person_item" (click)="showTieuSu(itemc.TieuSuId)">

            <div class="person_info">
              <div class="person_img">
                <img src="{{imageUrl + itemc.UrlAvt1}}" onerror="onerror=null;src='assets/img/Noimage.jpg';" />
              </div>
              <div class="person_content hidden-sm-down">
                <div class="person_name">{{itemc.HoTen}}</div>
                <p>Ngày sinh: {{itemc.NgaySinh | date: 'dd/MM/yyyy'}}</p>
                <p>Quê quán: {{itemc.QueQuan}}</p>
                <p>Chỗ ở hiện nay: {{itemc.NoiThuongTru}}</p>

              </div>

            </div>
          </div>

        </div>

      </div>

    </ng-container>

  </div>

</div>
