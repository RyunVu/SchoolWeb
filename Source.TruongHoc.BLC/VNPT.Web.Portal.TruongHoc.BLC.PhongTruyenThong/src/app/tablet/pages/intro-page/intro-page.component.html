<div class="section">

  <div class="wwwwItem">

    <div class="text-center hidden-md-up" style="padding-bottom: 30px;">
      <img src="assets/template/images/logoub.png" style="padding: 5px;
      background: #fff;
      border-radius: 50%;">
    </div>

    <div class="logoTop">
      <div class="logoDang hidden-sm-down">
        <img src="assets/template/images/logo.gif" style="width: 92%;">
      </div>

      <div class="logoText">
        <h3>truyền thống ngành giáo dục <br><span> tỉnh lâm đồng</span></h3>
      </div>

      <div class="logoDang hidden-sm-down" style="padding: 5px;background: #fff;">
        <img src="assets/template/images/logoub.png">
      </div>
    </div>

    <div class="sliImage">

      <swiper #swiper [config]="config" class="mySwiper">
        <ng-template *ngFor="let item of Images" swiperSlide class="itemswiper">
          <div class="itemSli" [ngStyle]="{'background-image': 'url(' + item.ImageUrl + ')'}">
          </div>
        </ng-template>
      </swiper>

    </div>

    <div (click)="gotoHome()" class="logoText">
      <button (click)="gotoHome()" class="btn btn-warning btn-lg box">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        Bắt đầu
      </button>
    </div>
  </div>

  <!-- https://i.gyazo.com/fc1e60ef0930746c9808a755a822ee4d.png -->
</div>
