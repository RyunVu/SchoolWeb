<div class="container w-100 mt-4">
    <div class="row">
        <div class="col-12">
            <h4>Danh sách HKD</h4>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <business-search-form (search)="search($event)" (paramsChange)="searchFormChange($event)"></business-search-form>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-12 business-list-wrapper">
            <business-list [loading]="loading" [showDoanhThu]="searchParams != null && searchParams.loaiHinh == 1" [list]="businessList" [typeSearch]="searchParams?.loaiHinh" [totalRecords]="totalRecords" (page)="pageChange($event)"></business-list>
        </div>
    </div>
</div>
