<div class="container w-100 mt-4">
    <div class="row">
        <div class="col-12">
            <h4>Danh sách Giấy Phép Xây Dựng</h4>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <permit-search-form (search)="search($event)" (paramsChange)="searchFormChange($event)"></permit-search-form>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-12 permit-list-wrapper">
            <permit-list [loading]="loading" [list]="permitList" [totalRecords]="totalRecords" (page)="pageChange($event)"></permit-list>
        </div>
    </div>
</div>
