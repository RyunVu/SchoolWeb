<!-- <p-toast></p-toast> -->
<div class="card card-primary">
    <div class="card-body">
        <div class="row">
            <div class="col-md-12">
                <div class="form-group">
                    <label for="Name">Tên chức vụ <span class="text-danger">(*)</span></label>
                    <input type="text" class="form-control" [(ngModel)]="item.Name">
                </div>
            </div>
            <div class="col-md-12">
                <div class="form-group">
                    <label for="Name">Mã code</label>
                    <input type="text" class="form-control" [(ngModel)]="item.Code">
                </div>
            </div>
            <!-- <div class="col-md-12">
                <div class="form-group">
                    <label for="Name">Loại danh sách</label>
                    <p-select [options]="types" [(ngModel)]="type" optionLabel="Name" optionValue="Id" [filter]="true" filterBy="Name" placeholder="Chọn loại danh sách" appendTo="body">
                    </p-select>
                </div>
            </div> -->
            <div class="col-md-12">
                <div class="form-group">
                    <label for="Name">Thứ tự</label>
                    <input type="number" class="form-control" [(ngModel)]="item.OrderNo" placeholder="Thứ tự">
                </div>
            </div>
            <div class="col-md-12">
                <div class="form-group">
                    <label for="Name">Mô tả</label>
                    <textarea class="form-control" [(ngModel)]="item.Description" rows="5" placeholder="Mô tả"></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="p-footer">
    <div class="f-contains">
        <button class="btn bg-pro color-white" type="submit" (click)="submit()" [disabled]="loading">Lưu thay đổi</button>
        <button class="btn btn-outline-danger" type="submit" (click)="cancel()">Thoát</button>
    </div>
</div>
