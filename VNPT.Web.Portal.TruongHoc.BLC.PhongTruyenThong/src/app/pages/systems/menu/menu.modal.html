<div class="row">
    <div class="col-md-4">
        <div class="form-group">
            <label for="menuTypes">Loại Menu</label>
            <div>
                <p-select optionLabel="Name" optionValue="Value" [filter]="true" [(ngModel)]="type"
                    [options]="menuTypes" appendTo="body">
                </p-select>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="form-group">
            <label for="DayOfBirth">Menu cha</label>
            <div>
                <p-select optionLabel="Name" optionValue="Id" [filter]="true" [(ngModel)]="parent" [options]="menus"
                    appendTo="body">
                </p-select>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="form-group">
            <label for="OrderNo">Thứ tự</label>
            <input type="text" class="form-control" [(ngModel)]="item.OrderNo">
        </div>
    </div>
</div>
<div class="row">
    <div class="col-md-4">
        <div class="form-group">
            <label for="Title">Tiêu đề</label>
            <input type="text" class="form-control" [(ngModel)]="item.Title">
        </div>
    </div>
    <div class="col-md-4">
        <div class="form-group">
            <label for="Icon">Icon</label>
            <input type="text" class="form-control" [(ngModel)]="item.Icon">
        </div>
    </div>
    <div class="col-md-4">
        <div class="form-group">
            <label for="RoleLevel">RoleLevel</label>
            <input type="text" class="form-control" [(ngModel)]="item.RoleLevel">
        </div>
    </div>
</div>
<div class="row">
    <div class="col-md-3">
        <div class="form-group">
            <label for="Action">Action</label>
            <input type="text" class="form-control" [(ngModel)]="item.Action" (change)="changeAction()">
        </div>
    </div>
    <div class="col-md-3">
        <div class="form-group">
            <label for="Parameter">Parameter</label>
            <input type="text" class="form-control" [(ngModel)]="item.Parameter">
        </div>
    </div>
    <div class="col-md-3">
        <div class="form-group">
            <label for="Parameter">Hiển thị</label>
            <p-checkbox [binary]="true" [(ngModel)]="item.IsShowMenu"></p-checkbox>
        </div>
    </div>

    <div class="col-md-3">
        <div class="form-group">
            <label for="Parameter">Có tham số động trên Url</label>
            <p-checkbox [binary]="true" [(ngModel)]="item.IsUseParameterUrl"></p-checkbox>

        </div>
    </div>
    <div class="col-md-12">
        <div class="form-group">
            <label for="Parameter">Quyền khác:</label>
            <textarea type="text" class="form-control" [(ngModel)]="item.OtherRole"></textarea>
            <small>Các quyền cách nhau bằng dấu;</small>
        </div>
    </div>
    <div class="col-md-12" *ngIf="generalInfos!= null && generalInfos.length > 0">
        <label for="Parameter">Cấu hình:</label>
        <table class="table">
            <tr>
                <th width="10%">Tên</th>
                <th width="15%">Nhãn</th>
                <th width="10%">Thứ tự</th>
                <th width="20%">Kiểu dữ liệu</th>
                <th>Cấu hình</th>
                <th width="10%">Hiển thị</th>
                <th width="10%">Bắt buộc</th>
            </tr>
            <tr *ngFor="let prop of generalInfos">
                <td>
                    {{prop.Name}}
                </td>
                <td>
                    <div class="form-group">
                        <input type="text" class="form-control" [(ngModel)]="prop.Label">
                    </div>
                </td>
                <td>
                    <p-inputNumber [(ngModel)]="prop.Order" [min]="0"></p-inputNumber>
                </td>
                <td>
                    <p-select optionLabel="Id" optionValue="Id" [(ngModel)]="prop.Type" [options]="typeProperties"
                        appendTo="body" (onChange)="ontypeChange(prop)">
                    </p-select>
                </td>
                <td>
                    <div class="form-group">
                        <input type="text" class="form-control" [(ngModel)]="prop.Setting">
                    </div>
                </td>
                <td>
                    <p-checkbox [binary]="true" [(ngModel)]="prop.Enabled"></p-checkbox>
                </td>
                <td>
                    <p-checkbox [binary]="true" [(ngModel)]="prop.Required"></p-checkbox>
                </td>
            </tr>
        </table>
    </div>
</div>
<!-- </div> -->

        <button class="btn btn-primary" (click)="submit()">Submit</button>
    </div> -->

<div class="p-footer">
    <div class="f-contains">
        <button class="btn bg-pro color-white" type="submit" (click)="submit()">Lưu thay đổi</button>
        <button class="btn btn-outline-danger" type="submit" (click)="cancel()">Thoát</button>
    </div>
</div>
