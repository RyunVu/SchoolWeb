<div class="row">
    <div class="col-md-12">
        <div class="form-group">
            <label for="Name">Tên</label>
            <input type="text" class="form-control" [(ngModel)]="item.Name" placeholder="Tên" />
        </div>
    </div>
    <div *ngFor="let col of parent.setting" class="col-md-{{col.Setting.col}}">
        <div class="form-group" *ngIf="col.Type == 'Text'">
            <label for="Name">{{col.Label}}<span *ngIf="col.Required" class="required"> *</span>:</label>
            <input type="text" class="form-control" [(ngModel)]="item[col.Name]" placeholder="{{col.Label}}" />
        </div>
        <div class="form-group" *ngIf="col.Type == 'Combobox'">
            <label for="Name">{{col.Label}}<span *ngIf="col.Required" class="required"> *</span>:</label>
            <p-select [options]="col['data']" styleClass="w-100" [(ngModel)]="item[col.Name]"
                [optionValue]="col['id']" [optionLabel]="col['label']" appendTo="body"></p-select>
        </div>
        <div class="form-group" *ngIf="col.Type == 'MultiLine'">
            <label for="Name">{{col.Label}}<span *ngIf="col.Required" class="required"> *</span>:</label>
            <textarea class="form-control" [(ngModel)]="item[col.Name]" rows="{{col.Setting.rows|| 3}}"
                placeholder="{{col.Label}}"></textarea>
        </div>
        <div class="form-group" *ngIf="col.Type == 'Int'">
            <label for="Name">{{col.Label}}<span *ngIf="col.Required" class="required"> *</span>:</label>
            <div>
                <p-inputNumber [(ngModel)]="item[col.Name]" [min]="col.Setting.min"
                    [max]="col.Setting.max"></p-inputNumber>
            </div>
        </div>
        <div class="form-group" *ngIf="col.Type == 'Decimal'">
            <label for="Name">{{col.Label}}<span *ngIf="col.Required" class="required"> *</span>:</label>
            <div>
                <p-inputNumber mode="decimal" [minFractionDigits]="col.Setting.digits|| 2" [(ngModel)]="item[col.Name]"
                    [min]="col.Setting.min" [max]="col.Setting.max"></p-inputNumber>
            </div>
        </div>
        <div class="form-group" *ngIf="col.Type == 'Boolean'">
            <label for="Name">{{col.Label}}<span *ngIf="col.Required" class="required"> *</span>:</label>
            <div>
                <p-checkbox [binary]="true" [(ngModel)]="item[col.Name]"></p-checkbox>
            </div>
        </div>
        <div class="form-group" *ngIf="col.Type == '[0,1]'">
            <label for="Name">{{col.Label}}<span *ngIf="col.Required" class="required"> *</span>:</label>
            <div>
                <p-checkbox [binary]="true" [(ngModel)]="item[col.Name]"></p-checkbox>
            </div>
        </div>
        <div class="form-group" *ngIf="col.Type == 'Time'">
            <label for="Name">{{col.Label}}<span *ngIf="col.Required" class="required"> *</span>:</label>
            <div>
                <p-datepicker [(ngModel)]="item[col.Name]" [timeOnly]="true" hourFormat="24" appendTo="body"></p-datepicker>
            </div>
        </div>
        <div class="form-group" *ngIf="col.Type == 'Date'">
            <label for="Name">{{col.Label}}<span *ngIf="col.Required" class="required"> *</span>:</label>
            <div>
                <p-datepicker [(ngModel)]="item[col.Name]" dateFormat="dd/mm/yy" appendTo="body"></p-datepicker>
            </div>
        </div>
        <div class="form-group" *ngIf="col.Type == 'CkEditor'">
            <label for="Name">{{col.Label}}<span *ngIf="col.Required" class="required"> *</span>:</label>
            <div>
                <ckeditor [value]="item[col.Name]" (onEditorKeyup)="changeContent($event,item,col.Name)">
                </ckeditor>
            </div>
        </div>
        <div class="form-group" *ngIf="col.Type == 'File'">
            <label for="Name">{{col.Label}}<span *ngIf="col.Required" class="required"> *</span>:</label>
            <div>
                <div class="btn bg-pro color-white" (click)="openFileDilog(col.Name)">
                    Chọn hình ảnh
                </div>
            </div>
            <div class="form-group" *ngIf="item[col.Name]">
                <div class="row-custom">
                    <div style="background-color: #ececec; width: 100px; height: 100px; padding: 10px;">
                        <img [src]="item[col.Name].ThumbUrl | imageUrlPipe" style="width: 100%; height: 100%" />
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<div class="p-footer">
    <div class="f-contains">
        <button class="btn btn-warning" type="submit" (click)="clone()" [disabled]="loading">
            Nhân bản
        </button>
        <button class="btn bg-pro color-white" type="submit" (click)="submit()" [disabled]="loading">
            Lưu thay đổi
        </button>
        <button class="btn btn-outline-danger" type="submit" (click)="cancel()">
            Thoát
        </button>
    </div>
</div>
