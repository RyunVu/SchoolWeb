<!-- <p-toast></p-toast> -->
<div class="row">
    <div class="col-md-12">
        <div class="form-group">
            <label for="Name">Khu vực <span class="text-danger">(*)</span></label>
            <p-select [options]="locations" [(ngModel)]="location" optionLabel="Name" optionValue="UnitCode" [filter]="true" filterBy="Name" placeholder="Chọn khu vực" appendTo="body" (onChange)="selectLocation($event)">
            </p-select>
        </div>
    </div>
    <div class="col-md-12">
        <div class="form-group">
            <label for="Name">Đơn vị <span class="text-danger">(*)</span></label>
            <p-select [options]="units" [(ngModel)]="unit" optionLabel="Name" optionValue="Id" [filter]="true" filterBy="Name" placeholder="Chọn đơn vị" appendTo="body" (onChange)="selectUnit($event)">
            </p-select>
        </div>
    </div>
    <div class="col-md-12">
        <div class="form-group">
            <label for="Name">Cán bộ <span class="text-danger">(*)</span></label>
            <p-select [options]="users" [(ngModel)]="user" optionLabel="Name" optionValue="Id" [filter]="true" filterBy="Name" placeholder="Chọn cán bộ" appendTo="body">
            </p-select>
        </div>
    </div>
    <div class="col-md-12">
        <div class="form-group">
            <label for="Name">Nội dung chia sẻ <span class="text-danger">(*)</span></label>
            <textarea class="form-control" [(ngModel)]="command" rows="5" placeholder="Nội dung"></textarea>
        </div>
    </div>
</div>

<div class="p-footer">
    <div class="f-contains">
        <button class="btn bg-pro color-white" type="submit" (click)="save()">Lưu</button>
        <button class="btn btn-outline-danger" type="submit" (click)="cancel()">Thoát</button>
    </div>
</div>
