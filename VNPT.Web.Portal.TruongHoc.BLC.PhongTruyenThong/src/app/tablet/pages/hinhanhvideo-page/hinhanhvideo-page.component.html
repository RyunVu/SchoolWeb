<div class="body-content">
  <div class="side_nav">
    <a (click)="backPage()" class="item_nav">
      <i class="fa fa-reply" aria-hidden="true"></i>
    </a>

    <a href="#/tablet" class="item_nav">
      <i class="fa fa-home" aria-hidden="true"></i>
    </a>
  </div>

  <nav id="menu-filter" class="sidenavfilter">

    <div (click)="closeFilter()" class="bg-close"></div>

    <div class="close-menu-filter close-menu" (click)="closeFilter()"><span><i class="fa fa-window-close"
          aria-hidden="true"></i></span></div>

    <div class="filter_action">
      <button class="btn-sm btn btn-outline-secondary"><i class="fas fa-ban"></i> Reset all</button>
      <button class="btn-sm btn btn-success"><i class="fas fa-check"></i> Áp dụng</button>
    </div>

  </nav>

  <div class="container">
    <div class="content-title text-center">
      <div class="c-title">{{subtitle}}</div>
    </div>
    <div class="row content-gd content-media">
      <div class="col-sm-12">
        <h4 style="font-weight: bold;">HÌNH ẢNH</h4>
      </div>
      <p-galleria [value]="imagesHA" [(visible)]="displayBasic"
        [(activeIndex)]="activeIndex" [containerStyle]="{'max-width': '80%'}" [numVisible]="9" [circular]="true"
        [fullScreen]="true" [showThumbnails]="false" [showItemNavigators]="true" [baseZIndex]="100000">
        <ng-template pTemplate="item" let-item>
          <img [src]="item.previewImageSrc" onerror="onerror=null;src='assets/img/Noimage.jpg';"
            style="width: 100%; display: block;-o-object-fit: contain; object-fit: contain;" />
        </ng-template>
        <ng-template pTemplate="thumbnail" let-item>
          <div class="p-grid p-nogutter p-justify-center">
            <img [src]="item.thumbnailImageSrc" style="display: block;max-height:85px" onerror="onerror=null;src='assets/img/Noimage.jpg';" />
          </div>
        </ng-template>

        <ng-template pTemplate="caption" let-item>
          <h4 style="margin-bottom: .5rem; color: #ffffff;">{{item.caption}}</h4>
        </ng-template>

      </p-galleria>
      <div class="col-sm-3" *ngFor="let i of lstHA">
        <div class="itemgd">
          <a (click)="clickImageHA(i.Id)" class="link_item">
            <img class="img_hover" src="{{i.ImageUrl}}" onerror="onerror=null;src='assets/img/Noimage.jpg';" />
          </a>
          <div class="itemgd-body">
            <a (click)="clickImageHA(i.Id)" class="gd-title">{{i.Title}}</a>
          </div>
        </div>
      </div>

      <div class="col-sm-12">
        <h4 style="font-weight: bold;">VIDEO</h4>
      </div>
      <p-galleria [value]="videos" [(visible)]="displayVideo" [containerStyle]="{'max-width': '80%'}" [numVisible]="9"
        [(activeIndex)]="activeIndexVD" [circular]="true" [fullScreen]="true" [showThumbnails]="false"
        [showItemNavigators]="true" [baseZIndex]="100000">
        <ng-template pTemplate="item" let-item>
          <iframe style="width: 100vw; height: 70vh;" [src]="item.previewVideoSrc"
            title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen></iframe>
        </ng-template>
      </p-galleria>
      <div class="col-sm-3" *ngFor="let item of lstVD; let i = index">
        <div class="itemgd">
          <a (click)="clickVideo(i)" class="link_item">
            <img class="img_hover" src="{{item.ImageUrl}}" onerror="onerror=null;src='assets/img/Noimage.jpg';" />
          </a>
          <div class="itemgd-body">
            <a (click)="clickVideo(i)" class="gd-title">{{item.Name}}
            </a>
          </div>
        </div>
      </div>

    </div>

    <!-- <div class="pagination-primary">
      <ul class="pagination">
        <li><a><i class="fa fa-caret-left"></i></a></li>
        <li><a class="active">1</a></li>
        <li><a>2</a></li>
        <li><a>3</a></li>
        <li><a>4</a></li>
        <li><a><i class="fa fa-caret-right"></i></a></li>
      </ul>
    </div> -->

  </div>
</div>
