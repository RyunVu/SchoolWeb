<p-toast></p-toast>
<div class="login-box">
    <div class="login-logo">
        <a [routerLink]="['/']"><b>Quản lý ATTP</b> </a>
    </div>
    <!-- /.login-logo -->
    <div class="card">
        <div class="card-body login-card-body">
            <p class="login-box-msg">Đăng nhập hệ thống</p>

            <form [formGroup]="loginForm" (ngSubmit)="login()" *ngIf="!checkOtp">
                <div class="input-group mb-3">
                    <input formControlName="username" type="username" class="form-control" placeholder="Username" />
                    <div class="input-group-append">
                        <div class="input-group-text">
                            <span class="fas fa-envelope"></span>
                        </div>
                    </div>
                </div>
                <div class="input-group mb-3">
                    <input formControlName="password" type="password" class="form-control" placeholder="Password" />
                    <div class="input-group-append">
                        <div class="input-group-text">
                            <span class="fas fa-lock"></span>
                        </div>
                    </div>
                </div>
                <div class="row" style="color: red;">
                    <p *ngIf="code == '0'">Vui lòng liên hệ admin để đăng ký tài khoản</p>
                    <p *ngIf="code == '1'">Đang đăng nhập</p>
                    <p *ngIf="code == '-1' || code == '404'">Tài khoản không tồn tại hoặc bị xóa</p>
                    <p *ngIf="code == '500'">{{message}}</p>
                </div>
                <div class="row">
                    <div class="col-7">
                        
                    </div>
                    <div class="col-5">
                        <app-button [type]="'submit'" [block]="true"  [loading]="isAuthLoading">Đăng nhập</app-button>
                    </div>
                </div>
            </form>
            <form [formGroup]="loginForm" (ngSubmit)="loginOtp()" *ngIf="checkOtp">
                <div class="input-group mb-3">
                    <input formControlName="Otp" type="Otp" class="form-control" placeholder="Otp" />
                    <div class="input-group-append">
                        <div class="input-group-text">
                            <span class="fas fa-envelope"></span>
                        </div>
                    </div>
                </div>
                
                <div class="row" style="color: red;">
                    <p *ngIf="code == '0'">Vui lòng liên hệ admin để đăng ký tài khoản</p>
                    <p *ngIf="code == '1'">Đang đăng nhập</p>
                    <p *ngIf="code == '-1' || code == '404'">Tài khoản không tồn tại hoặc bị xóa</p>
                    <p *ngIf="code == '500'">{{message}}</p>
                </div>
                <div class="row">
                    <div class="col-7">
                        
                    </div>
                    <div class="col-5">
                        <app-button [type]="'submit'" [block]="true" [loading]="isAuthLoading">Đăng nhập</app-button>
                    </div>
                </div>
            </form>

                </a>

            </div> -->

        </div>
        <!-- /.login-card-body -->
    </div>
</div>
