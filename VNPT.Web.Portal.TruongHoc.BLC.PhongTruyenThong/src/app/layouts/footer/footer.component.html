<footer class="main-footer">
  <div class="float-right d-none d-sm-block">
    <b>Web:</b> v{{ appVersion.version }}
    <span *ngIf="apiVersion">&nbsp;|&nbsp;<b>API:</b> v{{ apiVersion.Version }} <small class="text-muted" *ngIf="apiVersion.BuildDate">({{ apiVersion.BuildDate }})</small></span>
  </div>
  <strong>
    <div *ngFor="let item of licenses">
      
      <a href="{{item.url}}">{{item.type}}</a>
    </div>
  </strong>
</footer>
