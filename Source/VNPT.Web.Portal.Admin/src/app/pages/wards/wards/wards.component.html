<div class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1 class="m-0 text-dark">Quản lý phường xã</h1>
            </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item"><a href="#">Home</a></li>
                    <li class="breadcrumb-item active">Phường xã</li>
                </ol>
            </div>
        </div>
    </div>
</div>

<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-12 col-12">
                <div class="card">
                    <div class="card-header">
                        <div class="row">
                            <div class="col-md-6">
                                <h3 class="card-title">Danh sách phường xã</h3>
                            </div>
                        </div>
                    </div>
                    <div class="collapse show" id="collapseExample">
                        <div class="card card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="Name">Tỉnh</label>
                                        <p-dropdown [options]="provinces" [(ngModel)]="province" optionLabel="Name"
                                            optionValue="Id" [filter]="true" filterBy="Name" placeholder="Chọn tỉnh"
                                            appendTo="body">
                                        </p-dropdown>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="Name">Thành phố/huyện</label>
                                        <p-dropdown [options]="districts" [(ngModel)]="district" optionLabel="Name"
                                            optionValue="Id" [filter]="true" filterBy="Name"
                                            placeholder="Chọn thành phố/huyện" appendTo="body"
                                            (onChange)="selectDistrict($event)">
                                        </p-dropdown>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <p-table #dt  [value]="wards" [loading]="loading"
                        >
                            <ng-template pTemplate="header">
                                <tr>
                                    <th>Tên</th>
                                    <th style="width: 10rem">Thao tác</th>
                                </tr>
                            </ng-template>
                            <ng-template pTemplate="body" let-item>
                                <tr>
                                    <td>
                                        {{ item.Name }}
                                    </td>
                                    <td>
                                        <button class="btn btn-secondary" type="button"
                                            (click)="edit(item)">
                                            Map
                                        </button>
                                    </td>
                                </tr>
                            </ng-template>
                            <ng-template pTemplate="emptymessage">
                                <tr>
                                    <td colspan="3">No items found.</td>
                                </tr>
                            </ng-template>
                        </p-table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<p-confirmDialog header="Xác nhận" icon="pi pi-exclamation-triangle"></p-confirmDialog>
