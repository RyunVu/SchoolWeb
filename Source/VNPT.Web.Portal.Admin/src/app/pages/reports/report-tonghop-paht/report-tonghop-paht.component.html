<div class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1 class="m-0 text-dark">Báo cáo tổng hợp phản ánh hiện trường</h1>
            </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item"><a href="#">Home</a></li>
                    <li class="breadcrumb-item active">Báo cáo tổng hợp phản ánh hiện trường</li>
                </ol>
            </div>
        </div>
    </div>
</div>
<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-12 col-12">
                <div class="card">
                    <div class="card-header">
                        <div class="row">
                            <div class="col-md-6">
                                <h3 class="card-title">Báo cáo tổng hợp phản ánh hiện trường</h3>
                            </div>
                            <div class="col-md-6">
                                <button type="button" class="btn btn-info btn-sm float-right collapsed mr-3" data-toggle="collapse" data-target="#collapseExample" aria-expanded="true" aria-controls="collapseExample">
                                    <i class="fas fa-search"></i> Filter
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="collapse show" id="collapseExample">
                        <div class="card card-body">
                            <div class="row">
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label for="Name">Từ ngày</label>
                                        <p-calendar [(ngModel)]="startDateInput" [showIcon]="true" dateFormat="dd/mm/yy" appendTo="body"></p-calendar>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label for="Name">Đến ngày</label>
                                        <p-calendar [(ngModel)]="endDateInput" [showIcon]="true" dateFormat="dd/mm/yy" appendTo="body"></p-calendar>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label for="Name">Khu vực</label>
                                        <p-dropdown [options]="locations" [(ngModel)]="location" optionLabel="Name" optionValue="UnitCode" [filter]="true" filterBy="Name" placeholder="Chọn khu vực" appendTo="body" (onChange)="selectLocation($event)">
                                        </p-dropdown>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label for="Name">Đơn vị</label>
                                        <p-dropdown [options]="units" [(ngModel)]="unitInput" optionLabel="Name" optionValue="Id" placeholder="Chọn đơn vị" appendTo="body" [filter]="true" filterBy="Name">
                                        </p-dropdown>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-12">
                                    <button (click)="search()" type="button" class="btn btn-info btn-sm float-right">
                                        <i class="fa fa-filter"></i> Xem báo cáo
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="viewReport"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
