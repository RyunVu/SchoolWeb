<!-- <p-toast></p-toast> -->

<div class="row">
  <div class="col-md-4">
    <div class="form-group">
      <label for="Name">Thể loại</label>
      <p-dropdown
        [options]="types"
        [(ngModel)]="type"
        optionLabel="Name"
        optionValue="Id"
        [filter]="true"
        filterBy="Name"
        placeholder="Chọn thể loại"
        appendTo="body"
      >
      </p-dropdown>
    </div>
  </div>
  <div class="col-md-4">
    <div class="form-group">
      <label for="Title">Tên cơ quan</label>
      <input type="text" class="form-control" [(ngModel)]="name" />
    </div>
  </div>
  <div class="col-md-4">
    <div class="form-group">
      <label for="Title">Tên tóm tắt cơ quan</label>
      <input type="text" class="form-control" [(ngModel)]="shortname" />
    </div>
  </div>
  <div class="col-md-3">
    <div class="form-group">
      <label for="Title">Email</label>
      <input type="text" class="form-control" [(ngModel)]="email" />
    </div>
  </div>
  <div class="col-md-3">
    <div class="form-group">
      <label for="Title">Số điện thoại</label>
      <input type="text" class="form-control" [(ngModel)]="phonenumber" />
    </div>
  </div>
  <div class="col-md-3">
    <div class="form-group">
      <label for="Title">Đường dẫn website</label>
      <input type="text" class="form-control" [(ngModel)]="fburl" />
    </div>
  </div>
  <div class="col-md-3">
    <div class="form-group">
      <label for="Title">Mã số thuế</label>
      <input type="text" class="form-control" [(ngModel)]="taxcode" />
    </div>
  </div>
  <div class="col-md-4">
    <div class="form-group">
      <label for="Geo">Tọa độ</label>
      <input type="text" class="form-control" [(ngModel)]="geolocation" />
    </div>
  </div>
  <div class="col-md-4">
    <div class="form-group">
      <label for="Address">Địa chỉ</label>
      <input type="text" class="form-control" [(ngModel)]="address" />
    </div>
  </div>
  <div class="col-md-4">
    <div class="form-group">
      <label for="Address">Nội dung</label>
      <input type="text" class="form-control" [(ngModel)]="content" />
    </div>
  </div>
  <div class="col-md-3">
    <div class="form-group">
      <label for="Name">Thành phố/huyện</label>
      <p-dropdown
        [options]="districts"
        [(ngModel)]="district"
        optionLabel="Name"
        optionValue="Id"
        [filter]="true"
        filterBy="Name"
        placeholder="Chọn thành phố/huyện"
        appendTo="body"
        (onChange)="selectDistrict($event)"
      >
      </p-dropdown>
    </div>
  </div>
  <div class="col-md-3">
    <div class="form-group">
      <label for="Name">Phường xã/thị trấn</label>
      <p-dropdown
        [options]="wards"
        [(ngModel)]="ward"
        optionLabel="Name"
        optionValue="Id"
        [filter]="true"
        filterBy="Name"
        placeholder="Chọn phường xã/thị trấn"
        appendTo="body"
      >
      </p-dropdown>
    </div>
  </div>
  <div class="col-md-6"></div>
  <div class="col-md-3">
    <div class="row-custom"><b>Hình ảnh</b></div>
    <div class="row-custom">
      <div class="btn bg-pro color-white" (click)="openFileDilog()">
        Chọn hình ảnh
      </div>
    </div>
    <div class="row-custom">
      <div
        style="
          background-color: #ececec;
          width: 100px;
          height: 100px;
          padding: 10px;
        "
      >
        <img
          [src]="imageUrl | imageUrlPipe: 'thumb'"
          style="width: 100%; height: 100%"
        />
      </div>
    </div>
  </div>
  <div class="col-md-9">
    <div class="form-group">
      <label for="Description">Mô tả</label>
      <textarea
        class="form-control"
        [(ngModel)]="description"
        rows="5"
      ></textarea>
    </div>
  </div>
</div>

<div class="p-footer">
  <div class="f-contains">
    <button class="btn btn-info" type="submit" (click)="submit()">
      Lưu thay đổi
    </button>
    <button class="btn btn-outline-danger" type="submit" (click)="cancel()">
      Thoát
    </button>
  </div>
</div>
