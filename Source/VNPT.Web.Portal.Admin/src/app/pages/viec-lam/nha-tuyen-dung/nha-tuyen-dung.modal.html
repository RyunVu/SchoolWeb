<div class="row">
    <div class="col-md-3">
        <div class="form-group">
            <label for="Name">Tên</label>
            <input type="text" class="form-control" [(ngModel)]="item.Name" placeholder="Tên" />
        </div>
    </div>
    <div class="col-md-3">
        <div class="form-group">
            <label for="Name">Tên tóm tắt<tr></tr></label>
            <input type="text" class="form-control" [(ngModel)]="item.Name2" placeholder="Tên 2" />
        </div>
    </div>  
    <div class="col-md-3">
        <div class="form-group">
            <label for="Name">Code</label>
            <input type="text" class="form-control" [(ngModel)]="item.Code" placeholder="Code" />
        </div>
    </div>
    <div class="col-md-3">
        <div class="form-group">
            <label for="Name">Giám đốc</label>
            <input type="text" class="form-control" [(ngModel)]="item.Director" placeholder="Giám đốc" />
        </div>
    </div>
    <div class="col-md-3">
        <div class="form-group">
            <label for="Name">SDT</label>
            <input type="text" class="form-control" [(ngModel)]="item.PhoneNo" placeholder="Số điện thoại" />
        </div>
    </div>
    <div class="col-md-3">
        <div class="form-group">
            <label for="Name">Email</label>
            <input type="text" class="form-control" [(ngModel)]="item.Email" placeholder="Email" />
        </div>
    </div>
    <div class="col-md-3">
        <div class="form-group">
            <label for="Name">Website</label>
            <input type="text" class="form-control" [(ngModel)]="item.WebsiteUrl" placeholder="Website" />
        </div>
    </div>
    <div class="col-md-3">
        <div class="form-group">
            <label for="Name">Tọa độ</label>
            <input type="text" class="form-control" [(ngModel)]="item.GeoLocation" placeholder="Tọa độ" />
        </div>
    </div>
    <div class="col-md-4">
        <div class="form-group">
          <label for="Address">Địa chỉ</label>
          <input type="text" class="form-control" [(ngModel)]="item.Address" placeholder="Địa chỉ" />
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label for="Name">Thành phố/huyện</label>
          <p-dropdown
            [options]="districts"
            [(ngModel)]="item.LocationDistrictId"
            optionLabel="Name"
            optionValue="Id"
            [filter]="true"
            filterBy="Name"
            placeholder="Chọn thành phố/huyện"
            appendTo="body"
            (onChange)="selectDistrict($event)"
          >
          </p-dropdown>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label for="Name">Phường xã/thị trấn</label>
          <p-dropdown
            [options]="wards"
            [(ngModel)]="item.LocationWardId"
            optionLabel="Name"
            optionValue="Id"
            [filter]="true"
            filterBy="Name"
            placeholder="Chọn phường xã/thị trấn"
            appendTo="body"
          >
          </p-dropdown>
        </div>
      </div>
    <div class="col-md-6">
        <div class="form-group">
            <label for="Name">Mô tả</label>
            <textarea class="form-control" [(ngModel)]="item.Description" rows="7" placeholder="Mô tả"></textarea>
        </div>
    </div>
    <div class="col-md-6">
        <div class="row-custom"><b>Hình ảnh</b></div>
        <div class="row-custom">
            <div class="btn bg-pro color-white" (click)="openFileDilog()">
                Chọn hình ảnh
            </div>
        </div>
        <div class="row-custom">
            <div style="
        background-color: #ececec;
        width: 100px;
        height: 100px;
        padding: 10px;
      ">
                <img [src]="imageUrl | imageUrlPipe: 'thumb'" style="width: 100%; height: 100%" />
            </div>
        </div>
    </div>
</div>

<div class="p-footer">
    <div class="f-contains">
        <button class="btn btn-info" type="submit" (click)="submit()">
      Lưu thay đổi
    </button>
        <button class="btn btn-outline-danger" type="submit" (click)="cancel()">
      Thoát
    </button>
    </div>
</div>
