<div class="content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-6">
        <h1 class="m-0 text-dark">Danh mục lĩnh vực tuyển dụng</h1>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-right">
          <li class="breadcrumb-item"><a href="#">Home</a></li>
          <li class="breadcrumb-item active">Lĩnh vực tuyển dụng</li>
        </ol>
      </div>
    </div>
  </div>
</div>

<section class="content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-lg-12 col-12">
        <div class="card">
          <div class="card-header">
            <div class="row">
              <div class="col-md-6">
                <h3 class="card-title">
                  <b>Danh sách lĩnh vực tuyển dụng</b>
                </h3>
              </div>
              <div class="col-md-6">
                <button *ngIf="checkPermission('Add')" (click)="add()" type="button"
                  class="btn btn-info btn-sm float-right">
                  <i class="fas fa-plus"></i> Thêm mới
                </button>
                <button type="button" class="btn btn-info btn-sm float-right collapsed mr-3" data-toggle="collapse"
                  data-target="#collapseExample" aria-expanded="true" aria-controls="collapseExample">
                  <i class="fas fa-search"></i> Lọc nâng cao
                </button>
              </div>
            </div>
          </div>
          <div class="collapse show" id="collapseExample">
            <div class="card card-body">
              <div class="row">
                <div class="col-md-12">
                  <div class="form-group">
                    <label for="Name">Từ khóa tìm kiếm</label>
                    <input type="text" class="form-control" [(ngModel)]="keywordInput" placeholder="Từ khóa tìm kiếm" />
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-md-12">
                  <button (click)="search()" type="button" class="btn btn-info btn-sm float-right">
                    <i class="fa fa-filter"></i> Tìm kiếm
                  </button>
                  <button (click)="clearfilter()" type="button" class="btn btn-danger btn-sm float-right mr-3">
                    <i class="fa fa-circle"></i> Bỏ lọc nâng cao
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="card-body p-0">
            <p-table #dt [responsive]="true" [value]="items" [lazy]="true" (onLazyLoad)="paginate($event)"
              [paginator]="true" [rows]="10" [totalRecords]="totalRow" [loading]="loading" responsiveLayout="scroll">
              <ng-template pTemplate="header">
                <tr>
                  <th width="50%">Tên lĩnh vực</th>
                  <th width="10%">Hình ảnh</th>
                  <th width="30%">Mô tả</th>
                  <th width="10%">Thao tác</th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-item>
                <tr>
                  <td>{{ item.Name }}</td>
                  <td class="p-0">
                    <div style="
                        background-color: #ececec;
                        width: 80px;
                        height: 80px;
                        padding: 10px;
                      ">
                      <img [src]="item.ImageUrl | imageUrlPipe: 'thumb'" style="width: 100%; height: 100%" />
                    </div>
                  </td>
                  <td>{{ item.Description }}</td>
                  <td>
                    <div class="dropdown">
                      <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton"
                        data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        Thao tác
                      </button>
                      <div class="dropdown-menu dropdown-menu-right" role="menu">
                        <a class="dropdown-item" (click)="edit(item)" *ngIf="checkPermission('Edit')">Cập nhật</a>
                        <a class="dropdown-item" (click)="delete(item)" *ngIf="checkPermission('Delete')">Xóa</a>
                        <div class="dropdown-divider"></div>
                        <a *ngIf="checkPermission('View')" class="dropdown-item" (click)="history(item)">Lịch sử thay đổi</a>
                      </div>
                    </div>
                  </td>
                </tr>
              </ng-template>
            </p-table>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<p-confirmDialog header="Xác nhận" icon="pi pi-exclamation-triangle"></p-confirmDialog>
