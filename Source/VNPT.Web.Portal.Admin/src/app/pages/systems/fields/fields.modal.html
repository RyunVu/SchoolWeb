<!-- <p-toast></p-toast> -->

<div class="row">
    <div class="col-md-3">
        <div class="form-group">
            <label for="Name">Tên lĩnh vực <span class="text-danger">(*)</span></label>
            <input type="text" class="form-control" [(ngModel)]="item.Name" placeholder="Tên">
        </div>
    </div>
    <div class="col-md-3">
        <div class="form-group">
            <label for="Name">Mã code</label>
            <input type="text" class="form-control" [(ngModel)]="item.Code" placeholder="Mã code">
        </div>
    </div>
    <div class="col-md-3">
        <div class="form-group">
            <label for="Name">Thứ tự</label>
            <input type="number" class="form-control" [(ngModel)]="item.OrderNo" placeholder="Thứ tự">
        </div>
    </div>
    <div class="col-md-3">
        <div class="form-group">
            <div class="row-custom"><b>Màu nền</b></div>
            <div class="row-custom">
                <p-colorPicker [(ngModel)]="item.ColorCode"></p-colorPicker>
            </div>
        </div>
    </div>


    <div class="col-md-3">
        <div class="form-group">
            <label for="Name">Loại thời gian xử lý</label>
            <p-dropdown [options]="types" [(ngModel)]="type" optionLabel="Name" optionValue="Id" [filter]="true" filterBy="Name" placeholder="Chọn loại thời gian xử lý" appendTo="body" (onChange)="selectType($event)">
            </p-dropdown>
        </div>
    </div>
    <div class="col-md-3">
        <div class="form-group">
            <label for="Name">Thời gian xử lý</label>
            <input type="number" class="form-control" [(ngModel)]="item.Time" placeholder="Thời gian xử lý" [readOnly]="type == null">
        </div>
    </div>
    <div class="col-md-3">
        <div class="form-group">
            <label for="Name">Khu vực</label>
            <p-dropdown [options]="locations" [(ngModel)]="location" optionLabel="Name" optionValue="UnitCode" [filter]="true" filterBy="Name" placeholder="Chọn khu vực" appendTo="body" (onChange)="selectUnit($event)">
            </p-dropdown>
        </div>
    </div>
    <div class="col-md-3">
        <div class="form-group">
            <label for="Name">Đơn vị</label>
            <p-dropdown [options]="units" [(ngModel)]="unit" optionLabel="Name" optionValue="Id" [filter]="true" filterBy="Name" placeholder="Chọn Đơn vị" appendTo="body">
            </p-dropdown>
        </div>
    </div>
    <div class="col-md-3">
        <div class="row-custom"><b>Hình ảnh</b></div>
        <div class="row-custom">
            <div class="btn bg-pro color-white" (click)="openFileDilog()">Chọn hình ảnh</div>
        </div>
        <div class="row-custom">
            <div style="background-color: #ececec; width: 100px; height: 100px; padding: 10px;">
                <img [src]="imageUrl | imageUrlPipe: 'thumb'" style="width: 100%; height: 100%;" />
            </div>
        </div>
    </div>
    <div class="col-md-9">
        <div class="form-group">
            <label for="Name">Mô tả</label>
            <textarea class="form-control" [(ngModel)]="item.Description" rows="6" placeholder="Mô tả"></textarea>
        </div>
    </div>
</div>

<div class="p-footer">
    <div class="f-contains">
        <button class="btn btn-info" type="submit" (click)="submit()">Lưu thay đổi</button>
        <button class="btn btn-outline-danger" type="submit" (click)="cancel()">Thoát</button>
    </div>
</div>
