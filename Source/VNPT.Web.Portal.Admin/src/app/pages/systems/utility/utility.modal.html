<div class="row">
    <div class="col-md-4">
        <div class="form-group">
            <label for="Name">Khu vực <span style="color: red;">*</span></label>
            <p-dropdown [options]="locations" [(ngModel)]="location" optionLabel="Name" optionValue="Id" [filter]="true" filterBy="Name" placeholder="Chọn khu vực" appendTo="body">
            </p-dropdown>
        </div>
    </div>

    <div class="col-md-4">
        <div class="form-group">
            <label for="OrderNo">Code <span style="color: red;">*</span></label>
            <input type="text" class="form-control" [(ngModel)]="code" />
        </div>
    </div>

    <div class="col-md-4">
        <div class="form-group">
            <label for="Title">Tên tiện ích <span style="color: red;">*</span></label>
            <input type="text" class="form-control" [(ngModel)]="name" />
        </div>
    </div>
    <div class="col-md-4">
        <div class="form-group">
            <label for="Geo">Tọa độ</label>
            <input type="text" class="form-control" [(ngModel)]="geolocation" />
        </div>
    </div>
    <div class="col-md-4">
        <div class="form-group">
            <label for="Address">Địa chỉ</label>
            <input type="text" class="form-control" [(ngModel)]="address" />
        </div>
    </div>
    <div class="col-md-4">
        <div class="form-group">
            <label for="OrderNo">Lấy tất cả</label>
            <p-checkbox [(ngModel)]="isGetAllChildren" [binary]="true"></p-checkbox>
        </div>
    </div>
    <div class="col-md-3">
        <div class="form-group">
            <label for="Phone">Số điện thoại</label>
            <input type="number" class="form-control" [(ngModel)]="phonenumber" />
        </div>
    </div>
    <div class="col-md-3">
        <div class="form-group">
            <label for="OrderNo">Thứ tự <span style="color: red;">*</span></label>
            <input type="number" class="form-control" [(ngModel)]="orderno" />
        </div>
    </div>
    <div class="col-md-6"></div>
    <div class="col-md-3">
        <div class="row-custom"><b>Hình ảnh</b></div>
        <div class="row-custom">
            <div class="btn bg-pro color-white" (click)="openFileDilog()">
                Chọn hình ảnh
            </div>
        </div>
        <div class="row-custom">
            <div style="
          background-color: #ececec;
          width: 100px;
          height: 100px;
          padding: 10px;
        ">
                <img [src]="imageUrl | imageUrlPipe: 'thumb'" style="width: 100%; height: 100%" />
            </div>
        </div>
    </div>
    <div class="col-md-9">
        <div class="form-group">
            <label for="Description">Mô tả</label>
            <textarea class="form-control" [(ngModel)]="description" rows="6"></textarea>
        </div>
    </div>
</div>

<div class="p-footer">
    <div class="f-contains">
        <button class="btn btn-info" type="submit" (click)="submit()">
      Lưu thay đổi
    </button>
        <button class="btn btn-outline-danger" type="submit" (click)="cancel()">
      Thoát
    </button>
    </div>
</div>
