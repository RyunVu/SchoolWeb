<div class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1 class="m-0 text-dark">Quản lý Danh sách địa điểm bốc số</h1>
            </div>
        </div>
    </div>
</div>

<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-12 col-12">
                <div class="card">
                    <div class="card-header">
                        <div class="row">
                            <div class="col-md-6">
                                <h3 class="card-title"><b>Danh sách địa điểm bốc số</b></h3>
                            </div>
                            <div class="col-md-6">
                                <button *ngIf="checkPermission('Add')" (click)="add()" type="button" class="btn btn-info btn-sm float-right">
                                    <i class="fas fa-plus"></i> Thêm mới
                                </button>
                                <button type="button" class="btn btn-info btn-sm float-right mr-2" (click)="syncPAMC()"> 
                                    <i class="fas fa-sync-alt"></i> Đồng bộ PAMC
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="card-body p-0">
                        <p-table #dt [responsive]="true" [value]="items" [lazy]="true" (onLazyLoad)="paginate($event)" [paginator]="true" [rows]="10" [totalRecords]="totalRow" [loading]="loading" responsiveLayout="scroll">
                            <ng-template pTemplate="header">
                                <tr>
                                    <th width="30%">
                                        Tên
                                    </th>
                                    <th width="50%">
                                        Thông tin
                                    </th>
                                    <th width="20%">Thao tác</th>
                                </tr>
                            </ng-template>
                            <ng-template pTemplate="body" let-item>
                                <tr>
                                    <td>
                                        {{item.Name}}
                                    </td>
                                    <td>
                                        <b>Mã:</b> {{item.Code}}<br/>
                                        <b>Số điện thoại:</b> {{item.PhoneNo}}<br/>
                                        <b>Địa chỉ:</b> {{item.Address}}<br/>
                                        <b>Cấu hình:</b> {{item.Setting}}
                                    </td>
                                    <td>
                                        <div class="btn-group">
                                            <button type="button" class="btn btn-info btn-flat" data-toggle="dropdown" aria-expanded="false">Thao tác</button>
                                            <button type="button" class="btn btn-info btn-flat dropdown-toggle dropdown-icon" data-toggle="dropdown" aria-expanded="false">
                                                <span class="sr-only">Toggle Dropdown</span>
                                            </button>
                                            <div class="dropdown-menu" role="menu">
                                                <a *ngIf="checkPermission('View')" class="dropdown-item" (click)="detailItem(item)">Danh sách khu vực</a>
                                                <a *ngIf="checkPermission('Edit')" class="dropdown-item" (click)="edit(item)">Cập nhật</a>
                                                <a *ngIf="checkPermission('Delete')" class="dropdown-item" (click)="delete(item)">Xóa</a>
                                                <div class="dropdown-divider"></div>
                                                <a *ngIf="checkPermission('View')" class="dropdown-item" (click)="history(item)" target="_blank">Lịch sử thay đổi</a>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </ng-template>
                        </p-table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<p-confirmDialog header="Xác nhận" icon="pi pi-exclamation-triangle"></p-confirmDialog>
