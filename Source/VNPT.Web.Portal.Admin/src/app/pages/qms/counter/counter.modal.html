<!-- <p-toast></p-toast> -->
<div class="row">
    <div class="col-md-12">
        <div class="form-group">
            <label for="Name">Mã</label>
            <input type="text" class="form-control" [(ngModel)]="item.Code" placeholder="Mã">
        </div>
    </div>
    <div class="col-md-12">
        <div class="form-group">
            <label for="Name">Tên <span class="text-danger">(*)</span></label>
            <input type="text" class="form-control" [(ngModel)]="item.Name" placeholder="Tên">
        </div>
    </div>
    <div class="col-md-12">
        <div class="form-group">
            <label for="Name">Tên ngắn gọn</label>
            <input type="text" class="form-control" [(ngModel)]="item.ShortName" placeholder="Tên ngắn gọn">
        </div>
    </div>
    <div class="col-md-12">
        <div class="form-group">
            <label for="Name">Id <span class="text-danger">(*)</span></label>
            <input type="number" class="form-control" [(ngModel)]="item.Id" placeholder="Id">
        </div>
    </div>
    <div class="col-md-12">
        <div class="form-group">
            <label for="Name">Id quầy <span class="text-danger">(*)</span></label>
            <input type="text" class="form-control" [(ngModel)]="item.CounterId" placeholder="Id quầy">
        </div>
    </div>
    <div class="col-md-12">
        <div class="form-group">
            <label for="Name">Tiền tố <span class="text-danger">(*)</span></label>
            <input type="number" class="form-control" [(ngModel)]="item.Sort" placeholder="Tiền tố">
        </div>
    </div>
</div>

<div class="p-footer">
    <div class="f-contains">
        <button class="btn btn-info" type="submit" (click)="submit()">Lưu thay đổi</button>
        <button class="btn btn-outline-danger" type="submit" (click)="cancel()">Thoát</button>
    </div>
</div>
