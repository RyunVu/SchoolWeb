<!-- <p-toast></p-toast> -->
<div class="card card-primary">
    <div class="card-body">
        <div class="row">
            <div class="col-md-12">
                <div class="form-group">
                    <label for="Name">Nhập mật khẩu mới <span class="text-danger">(*)</span></label>
                    <input type="password" minlength="6" maxlength="18" class="form-control" [(ngModel)]="defaultPassword">
                </div>
            </div>
            <div class="col-md-12">
                <div class="form-group">
                    <label for="Name">Nhập lại mật khẩu mới <span class="text-danger">(*)</span></label>
                    <input type="password" minlength="6" maxlength="18" class="form-control" [(ngModel)]="defaultPasswordConfirm">
                </div>
            </div>
        </div>
    </div>
</div>

<div class="p-footer">
    <div class="f-contains">
        <button class="btn btn-info" type="submit" (click)="submit()">Lưu thay đổi</button>
        <button class="btn btn-outline-danger" type="submit" (click)="cancel()">Thoát</button>
    </div>
</div>
